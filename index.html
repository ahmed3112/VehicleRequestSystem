<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>موقف العربيات | إدارة الخطوط والسيارات</title>
<style>
:root{--nav:#0f172a;--blue:#2563eb;--blue2:#1d4ed8;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--danger:#dc2626;--success:#16a34a;--shadow:0 10px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}.hidden{display:none!important}
/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#dbeafe 0,#f8fafc 42%,#eef2ff 100%)}.login-card{width:min(430px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:34px;box-shadow:0 25px 60px rgba(15,23,42,.12)}.brand-icon{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#2563eb,#0f172a);display:grid;place-items:center;color:#fff;font-size:38px;margin:0 auto 18px}.login-card h1{text-align:center;margin:0 0 8px;font-size:25px}.login-card p{text-align:center;color:var(--muted);margin:0 0 24px}.field{margin-bottom:16px}.field label{display:block;font-weight:700;margin-bottom:8px;font-size:14px}input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:11px;background:#fff;outline:none;transition:.2s}input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px #dbeafe}.primary{width:100%;border:0;border-radius:11px;padding:13px 16px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.primary:hover{background:var(--blue2)}.login-error{color:var(--danger);text-align:center;font-size:14px;min-height:20px;margin-top:10px}
/* App */
.topbar{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.97);color:#fff;box-shadow:0 3px 15px #0002}.topbar-inner{max-width:1450px;margin:auto;padding:13px 20px;display:flex;align-items:center;gap:20px}.logo{font-weight:800;font-size:18px;white-space:nowrap}.nav{display:flex;gap:6px;flex:1}.nav button{background:transparent;color:#cbd5e1;border:0;padding:10px 14px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#1e293b;color:#fff}.logout{border:0;background:#b91c1c;color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer}.container{max-width:1450px;margin:0 auto;padding:28px 20px 50px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.page-head h1{margin:0;font-size:28px}.page-head p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:#e2e8f0;color:#172033}.btn-danger{background:#fee2e2;color:#b91c1c}.btn-print{background:#0f172a;color:#fff}.card{background:var(--card);border:1px solid #e8edf3;border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.stat{background:#fff;border:1px solid #e8edf3;border-radius:16px;padding:20px;box-shadow:var(--shadow)}.stat-label{color:var(--muted);font-size:14px}.stat-value{font-size:34px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.full{grid-column:1/-1}.form-title{margin:0 0 18px;font-size:19px}.form-actions{display:flex;justify-content:flex-start;gap:9px;margin-top:8px}.search{position:relative}.search input{padding-right:42px}.search-icon{position:absolute;right:14px;top:12px;color:#94a3b8}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:980px;background:#fff}.table th,.table td{padding:13px 12px;border-bottom:1px solid #eef2f7;text-align:right;white-space:nowrap}.table th{background:#f8fafc;font-size:13px;color:#475569}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#f8fbff}.count-badge{display:inline-flex;min-width:34px;justify-content:center;padding:5px 9px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-weight:800}.empty{text-align:center;padding:35px;color:var(--muted)}.notice{position:fixed;left:20px;bottom:20px;z-index:50;background:#0f172a;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:0 10px 30px #0003;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}.notice.show{opacity:1;transform:none}.line-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.line-card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:17px}.line-card h3{margin:0 0 7px}.line-card .num{font-size:28px;font-weight:800}.muted{color:var(--muted)}
/* Print */
@media print{body{background:#fff}.topbar,.actions,.no-print,#login,.notice{display:none!important}.container{padding:0;max-width:none}.card,.stat{box-shadow:none;border:0;padding:0}.page-head{margin-bottom:15px}.page-head h1{font-size:24px}.print-header{display:block!important}.table-wrap{border:1px solid #111}.table{min-width:0}.table th,.table td{border:1px solid #bbb;padding:7px;font-size:11px}.print-only{display:block!important}.print-break{page-break-before:always}.print-footer{display:block!important;margin-top:15px;font-size:11px;color:#555}.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid #aaa;padding:10px}.stat-value{font-size:22px}.line-cards{display:none}}
@media(max-width:800px){.topbar-inner{padding:11px 12px;gap:8px}.logo{font-size:15px}.nav{overflow-x:auto}.nav button{padding:9px 10px;white-space:nowrap}.logout{font-size:12px}.container{padding:20px 12px 40px}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:23px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:16px}.form-actions{flex-direction:column}.form-actions .btn{width:100%}.table{min-width:900px}}
@media(max-width:430px){.stats{grid-template-columns:1fr}.stats .stat:last-child{grid-column:auto}.login-card{padding:25px 20px}}
.print-only{display:none}.print-header{display:none}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="login-card">
    <div class="brand-icon">🚗</div>
    <h1>نظام إدارة موقف العربيات</h1>
    <p>تسجيل الدخول إلى النظام</p>
    <div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username" placeholder="اسم المستخدم"></div>
    <div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="primary" onclick="login()">دخول إلى النظام</button>
    <div id="loginError" class="login-error"></div>
  </div>
</section>

<div id="app" class="hidden">
<header class="topbar"><div class="topbar-inner">
  <div class="logo">🚗 موقف العربيات</div>
  <nav class="nav"><button id="navDashboard" onclick="show('dashboard')">الرئيسية</button><button id="navLines" onclick="show('lines')">خطوط السير</button><button id="navVehicles" onclick="show('vehicles')">العربيات</button></nav>
  <button class="logout" onclick="logout()">خروج</button>
</div></header>
<main class="container">
  <div id="dashboard"></div><div id="lines" class="hidden"></div><div id="vehicles" class="hidden"></div>
</main>
</div>
<div id="notice" class="notice"></div>

<script>
const USER='admin',PASS='Admin@123',KEY='parking_management_final_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"lines":[],"vehicles":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(text){const n=document.getElementById('notice');n.textContent=text;n.classList.add('show');clearTimeout(window.nt);window.nt=setTimeout(()=>n.classList.remove('show'),2500)}
function login(){if(username.value.trim()===USER&&password.value===PASS){sessionStorage.setItem('parking_login','1');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');show('dashboard')}else document.getElementById('loginError').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}
function logout(){sessionStorage.removeItem('parking_login');location.reload()}
function show(id){['dashboard','lines','vehicles'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('active');renderAll()}
function lineName(id){return data.lines.find(x=>x.id===id)?.name||'بدون خط'}
function renderAll(){renderDashboard();renderLines();renderVehicles()}
function renderDashboard(){
 const totalCars=data.vehicles.length;
 document.getElementById('dashboard').innerHTML=`
 <div class="page-head"><div><h1>لوحة التحكم</h1><p>ملخص سريع للموقف وخطوط السير</p></div><div class="actions"><button class="btn btn-print" onclick="printReport()">🖨️ طباعة كشف الخطوط والعربيات</button></div></div>
 <div class="stats"><div class="stat"><div class="stat-label">إجمالي خطوط السير</div><div class="stat-value">${data.lines.length}</div></div><div class="stat"><div class="stat-label">إجمالي العربيات</div><div class="stat-value">${totalCars}</div></div><div class="stat"><div class="stat-label">متوسط العربيات لكل خط</div><div class="stat-value">${data.lines.length?(totalCars/data.lines.length).toFixed(1):0}</div></div></div>
 <div class="card"><div class="page-head"><div><h2 style="margin:0">خطوط السير</h2><p>عدد العربيات المسجلة تحت كل خط</p></div><button class="btn btn-primary no-print" onclick="show('lines')">إدارة الخطوط</button></div>
 <div class="line-cards">${data.lines.map(l=>`<div class="line-card"><h3>${esc(l.name)}</h3><div class="muted">عدد العربيات</div><div class="num">${data.vehicles.filter(v=>v.lineId===l.id).length}</div></div>`).join('')||'<div class="empty">لم تتم إضافة أي خط حتى الآن</div>'}</div></div>`}
function renderLines(){
 document.getElementById('lines').innerHTML=`
 <div class="page-head"><div><h1>خطوط السير</h1><p>أضف الخط ثم اربط به العربيات</p></div><div class="actions"><button class="btn btn-print" onclick="printReport()">🖨️ طباعة</button></div></div>
 <form class="card no-print" onsubmit="addLine(event)"><h2 class="form-title">إضافة خط سير جديد</h2><div class="grid"><div class="field"><label>اسم خط السير</label><input id="lineName" required placeholder="مثال: المصنع - القاهرة"></div></div><div class="form-actions"><button class="btn btn-primary">+ إضافة الخط</button></div></form>
 <div class="card"><div class="search no-print"><span class="search-icon">🔎</span><input id="lineSearch" placeholder="ابحث باسم الخط..." oninput="drawLinesTable()"></div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>#</th><th>اسم خط السير</th><th>عدد العربيات</th><th class="no-print">إجراء</th></tr></thead><tbody id="linesBody"></tbody></table></div></div>`;
 drawLinesTable()}
function drawLinesTable(){const q=(document.getElementById('lineSearch')?.value||'').toLowerCase();const rows=data.lines.filter(l=>l.name.toLowerCase().includes(q));document.getElementById('linesBody').innerHTML=rows.map((l,i)=>`<tr><td>${i+1}</td><td><b>${esc(l.name)}</b></td><td><span class="count-badge">${data.vehicles.filter(v=>v.lineId===l.id).length}</span></td><td class="no-print"><button class="btn btn-danger" onclick="deleteLine('${l.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد خطوط</td></tr>'}
function addLine(e){e.preventDefault();const name=document.getElementById('lineName').value.trim();if(data.lines.some(l=>l.name===name))return notify('هذا الخط موجود بالفعل');data.lines.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name});save();notify('تم إضافة خط السير بنجاح');renderAll();document.getElementById('lineName').value=''}
function deleteLine(id){const used=data.vehicles.some(v=>v.lineId===id);if(used)return notify('لا يمكن حذف الخط لأنه مرتبط بعربيات');if(confirm('هل تريد حذف خط السير؟')){data.lines=data.lines.filter(l=>l.id!==id);save();notify('تم حذف الخط');renderAll()}}
function renderVehicles(){
 document.getElementById('vehicles').innerHTML=`
 <div class="page-head"><div><h1>العربيات</h1><p>بيانات العربيات التابعة للموقف وخطوط السير</p></div><div class="actions"><button class="btn btn-print" onclick="printReport()">🖨️ طباعة كشف كامل</button></div></div>
 <form class="card no-print" onsubmit="addVehicle(event)"><h2 class="form-title">إضافة عربية</h2><div class="grid">
 <div class="field"><label>اسم الموقف</label><input id="parkingName" required></div>
 <div class="field"><label>رقم السيارة</label><input id="plateNumber" required placeholder="مثال: 1234"></div>
 <div class="field"><label>حروف وأرقام</label><input id="plateLettersNumbers" placeholder="مثال: أ ب ج / 1234"></div>
 <div class="field"><label>مالك السيارة</label><input id="ownerName"></div>
 <div class="field"><label>رقم الشاسيه</label><input id="chassis"></div>
 <div class="field"><label>خط السير</label><select id="lineId"><option value="">-- اختر خط السير --</option>${data.lines.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div>
 <div class="field"><label>رقم التليفون</label><input id="phone" type="tel"></div>
 <div class="field"><label>الكارتة المجمعة</label><input id="cardNo"></div>
 <div class="field"><label>عدد الركاب</label><input id="passengers" type="number" min="0"></div>
 </div><div class="form-actions"><button class="btn btn-primary">+ إضافة العربية</button></div></form>
 <div class="card"><div class="search no-print"><span class="search-icon">🔎</span><input id="vehicleSearch" placeholder="ابحث برقم السيارة أو المالك أو الشاسيه أو الخط..." oninput="drawVehiclesTable()"></div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>#</th><th>اسم الموقف</th><th>رقم السيارة</th><th>حروف وأرقام</th><th>مالك السيارة</th><th>رقم الشاسيه</th><th>خط السير</th><th>رقم التليفون</th><th>الكارتة المجمعة</th><th>عدد الركاب</th><th class="no-print">إجراء</th></tr></thead><tbody id="vehiclesBody"></tbody></table></div></div>`;
 drawVehiclesTable()}
function drawVehiclesTable(){const q=(document.getElementById('vehicleSearch')?.value||'').toLowerCase();const rows=data.vehicles.filter(v=>Object.values(v).join(' ').toLowerCase().includes(q));document.getElementById('vehiclesBody').innerHTML=rows.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.parkingName)}</td><td><b>${esc(v.plateNumber)}</b></td><td>${esc(v.plateLettersNumbers)}</td><td>${esc(v.ownerName||'-')}</td><td>${esc(v.chassis||'-')}</td><td>${esc(lineName(v.lineId))}</td><td>${esc(v.phone||'-')}</td><td>${esc(v.cardNo||'-')}</td><td>${esc(v.passengers||'-')}</td><td class="no-print"><button class="btn btn-danger" onclick="deleteVehicle('${v.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="11" class="empty">لا توجد عربيات</td></tr>'}
function addVehicle(e){e.preventDefault();const plate=document.getElementById('plateNumber').value.trim();if(data.vehicles.some(v=>v.plateNumber===plate))return notify('رقم السيارة موجود بالفعل');data.vehicles.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),parkingName:document.getElementById('parkingName').value.trim(),plateNumber:plate,plateLettersNumbers:document.getElementById('plateLettersNumbers').value.trim(),ownerName:document.getElementById('ownerName').value.trim(),chassis:document.getElementById('chassis').value.trim(),lineId:document.getElementById('lineId').value,phone:document.getElementById('phone').value.trim(),cardNo:document.getElementById('cardNo').value.trim(),passengers:document.getElementById('passengers').value});save();notify('تم إضافة العربية بنجاح');renderAll()}
function deleteVehicle(id){if(confirm('هل تريد حذف العربية؟')){data.vehicles=data.vehicles.filter(v=>v.id!==id);save();notify('تم حذف العربية');renderAll()}}
function printReport(){
 const w=window.open('','_blank');if(!w)return notify('المتصفح منع نافذة الطباعة، اسمح بالنوافذ المنبثقة');
 const now=new Date().toLocaleString('ar-EG');
 const lineRows=data.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}</td><td>${data.vehicles.filter(v=>v.lineId===l.id).length}</td></tr>`).join('');
 const detailRows=data.lines.map((l,li)=>{const cars=data.vehicles.filter(v=>v.lineId===l.id);return `<tr class="line-title"><td colspan="10">${li+1}. خط السير: <b>${esc(l.name)}</b> — عدد العربيات: <b>${cars.length}</b></td></tr>`+cars.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.parkingName)}</td><td>${esc(v.plateNumber)}</td><td>${esc(v.plateLettersNumbers)}</td><td>${esc(v.ownerName||'-')}</td><td>${esc(v.chassis||'-')}</td><td>${esc(v.phone||'-')}</td><td>${esc(v.cardNo||'-')}</td><td>${esc(v.passengers||'-')}</td></tr>`).join('')}).join('');
 const unassigned=data.vehicles.filter(v=>!v.lineId);const unRows=unassigned.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.parkingName)}</td><td>${esc(v.plateNumber)}</td><td>${esc(v.plateLettersNumbers)}</td><td>${esc(v.ownerName||'-')}</td><td>${esc(v.chassis||'-')}</td><td>${esc(v.phone||'-')}</td><td>${esc(v.cardNo||'-')}</td><td>${esc(v.passengers||'-')}</td></tr>`).join('');
 w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>كشف موقف العربيات</title><style>body{font-family:Tahoma,Arial,sans-serif;color:#111;margin:25px}h1{margin:0 0 5px;font-size:23px}.sub{color:#555;margin-bottom:20px}.summary{display:flex;gap:25px;margin:15px 0;font-weight:bold}.box{border:1px solid #999;padding:10px}.line-title td{background:#e5e7eb;font-weight:bold;padding:9px;border:1px solid #999}table{width:100%;border-collapse:collapse;margin-bottom:20px}th,td{border:1px solid #999;padding:7px;text-align:right;font-size:11px}th{background:#f3f4f6}.sign{margin-top:35px;display:flex;justify-content:space-between}.no-print{display:none}@media print{body{margin:10mm}}</style></head><body><h1>نظام إدارة موقف العربيات</h1><div class="sub">كشف الخطوط والعربيات — تاريخ الطباعة: ${esc(now)}</div><div class="summary"><div class="box">عدد الخطوط: ${data.lines.length}</div><div class="box">عدد العربيات: ${data.vehicles.length}</div></div><h2>ملخص خطوط السير</h2><table><thead><tr><th>#</th><th>اسم خط السير</th><th>عدد العربيات</th></tr></thead><tbody>${lineRows||'<tr><td colspan="3">لا توجد خطوط</td></tr>'}</tbody></table><h2>تفاصيل العربيات حسب خط السير</h2><table><thead><tr><th>#</th><th>اسم الموقف</th><th>رقم السيارة</th><th>حروف وأرقام</th><th>مالك السيارة</th><th>رقم الشاسيه</th><th>رقم التليفون</th><th>الكارتة المجمعة</th><th>عدد الركاب</th></tr></thead><tbody>${detailRows||'<tr><td colspan="9">لا توجد عربيات</td></tr>'}${unassigned.length?`<tr class="line-title"><td colspan="9">عربيات بدون خط سير — عددها: ${unassigned.length}</td></tr>${unRows}`:''}</tbody></table><div class="sign"><span>مسؤول الموقف: ....................</span><span>التوقيع: ....................</span></div><script>window.onload=()=>{window.print()}</script></body></html>`);w.document.close();
}
if(sessionStorage.getItem('parking_login')==='1'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');show('dashboard')}
</script>
</body></html>
