<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>نظام إدارة موقف العربيات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}.hidden{display:none!important}button,input,select{font:inherit}button{cursor:pointer}input,select{width:100%;padding:12px;border:1px solid #d9e0e8;border-radius:10px;background:#fff;outline:0}input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eaf2ff,#f8fafc)}.login-card{width:min(420px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 20px 55px #0f172a22}.icon{width:72px;height:72px;margin:auto auto 18px;border-radius:20px;display:grid;place-items:center;background:#2563eb;color:#fff;font-size:38px}.login-card h1{text-align:center;font-size:25px;margin:0 0 8px}.sub{text-align:center;color:#64748b;margin:0 0 25px}.field{margin-bottom:14px}.field label{display:block;font-weight:700;margin-bottom:7px;font-size:14px}.primary,.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700}.primary{width:100%;background:#2563eb;color:#fff}.err{color:#dc2626;text-align:center;min-height:20px;margin-top:10px}.top{background:#0f172a;color:#fff;position:sticky;top:0;z-index:20}.topin{max-width:1450px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:18px}.brand{font-weight:800;white-space:nowrap}.nav{display:flex;gap:5px;flex:1}.nav button{border:0;background:transparent;color:#cbd5e1;padding:10px 13px;border-radius:8px}.nav button.active,.nav button:hover{background:#1e293b;color:#fff}.logout{border:0;background:#b91c1c;color:#fff;border-radius:8px;padding:9px 13px}.wrap{max-width:1450px;margin:auto;padding:25px 18px 45px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.head h1{margin:0;font-size:27px}.head p{margin:5px 0;color:#64748b}.card{background:#fff;border:1px solid #e5eaf0;border-radius:15px;padding:19px;margin-bottom:17px;box-shadow:0 6px 22px #0f172a0a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e5eaf0;border-radius:15px;padding:19px}.label{color:#64748b;font-size:14px}.value{font-size:32px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.blue{background:#2563eb;color:#fff}.dark{background:#0f172a;color:#fff}.red{background:#fee2e2;color:#b91c1c}.gray{background:#e2e8f0;color:#172033}.search{margin-bottom:13px}.table-wrap{overflow:auto;border:1px solid #e1e7ee;border-radius:11px}.table{width:100%;min-width:1100px;border-collapse:collapse}.table th,.table td{padding:11px 10px;border-bottom:1px solid #edf0f4;text-align:right;white-space:nowrap}.table th{background:#f8fafc;color:#475569;font-size:13px}.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 9px;border-radius:20px;font-weight:800}.empty{text-align:center;color:#64748b;padding:30px}.toast{position:fixed;bottom:20px;left:20px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s;z-index:99}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:15px;z-index:50}.modal-box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:#f1f5f9;border-radius:9px;padding:8px 12px}.license{max-width:220px;max-height:160px;border-radius:9px;margin-top:8px}.note{font-size:12px;color:#64748b;margin-bottom:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.topin{gap:8px;padding:10px}.brand{font-size:14px}.nav{overflow:auto}.nav button{white-space:nowrap;padding:8px}.wrap{padding:18px 11px}.head{align-items:flex-start;flex-direction:column}.stats,.grid{grid-template-columns:1fr}.actions,.actions button{width:100%}}@media print{.top,.no-print,#login,.toast,.modal{display:none!important}body{background:#fff}.wrap{padding:0}.card{border:0;box-shadow:none;padding:0}.table-wrap{border:1px solid #222}.table{min-width:0}.table th,.table td{border:1px solid #aaa;font-size:10px;padding:6px}}
</style></head><body>
<section id="login" class="login"><div class="login-card"><div class="icon">🚗</div><h1>نظام إدارة موقف العربيات</h1><p class="sub">تسجيل الدخول إلى النظام</p><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username" value="admin"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" onclick="login()">دخول إلى النظام</button><div id="err" class="err"></div></div></section>
<div id="app" class="hidden"><header class="top"><div class="topin"><div class="brand">🚗 موقف العربيات</div><nav class="nav"><button id="nDashboard" onclick="show('dashboard')">الرئيسية</button><button id="nLines" onclick="show('lines')">خطوط السير</button><button id="nVehicles" onclick="show('vehicles')">العربيات</button></nav><button class="logout" onclick="logout()">خروج</button></div></header><main class="wrap"><div id="dashboard"></div><div id="lines" class="hidden"></div><div id="vehicles" class="hidden"></div></main></div><div id="toast" class="toast"></div><div id="modal" class="modal hidden"></div>
<script>
'use strict';
const USER='admin',PASS='Admin@123',DBKEY='parking_sqlite_db_v1';let db=null;
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
async function initDB(){const SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/'+f});const old=localStorage.getItem(DBKEY);if(old){db=new SQL.Database(new Uint8Array(JSON.parse(old)));}else{db=new SQL.Database();db.run(`CREATE TABLE lines(id TEXT PRIMARY KEY,name TEXT NOT NULL UNIQUE);CREATE TABLE vehicles(id TEXT PRIMARY KEY,parking_name TEXT,plate_number TEXT,owner_name TEXT,chassis TEXT,line_id TEXT,phone TEXT,card_no TEXT,passengers TEXT,license_image TEXT,FOREIGN KEY(line_id) REFERENCES lines(id));`);migrateOld()}saveDB()}
function migrateOld(){try{const old=JSON.parse(localStorage.getItem('parking_management_final_v3')||localStorage.getItem('parking_management_final_v2')||'null');if(!old)return;(old.lines||[]).forEach(l=>db.run('INSERT OR IGNORE INTO lines VALUES(?,?)',[l.id,l.name]));(old.vehicles||[]).forEach(v=>db.run('INSERT OR IGNORE INTO vehicles VALUES(?,?,?,?,?,?,?,?,?,?)',[v.id,v.parkingName||'',v.plateNumber||v.plateLettersNumbers||'',v.ownerName||'',v.chassis||'',v.lineId||'',v.phone||'',v.cardNo||'',v.passengers||'',v.licenseImage||'']));}catch(e){console.warn(e)}}
function saveDB(){const a=Array.from(db.export());localStorage.setItem(DBKEY,JSON.stringify(a))}
function q(sql,args=[]){return db.exec(sql,args.length?args:undefined)}function rows(sql,args=[]){const r=q(sql,args)[0];if(!r)return[];return r.values.map(a=>Object.fromEntries(r.columns.map((c,i)=>[c,a[i]])))}
function login(){if($('username').value.trim()===USER&&$('password').value===PASS){sessionStorage.setItem('parking_login','1');$('login').classList.add('hidden');$('app').classList.remove('hidden');show('dashboard')}else $('err').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});function logout(){sessionStorage.removeItem('parking_login');location.reload()}
function show(id){['dashboard','lines','vehicles'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('n'+id[0].toUpperCase()+id.slice(1)).classList.add('active');render()}
function render(){dashboard();lines();vehicles()}
function dashboard(){const ls=rows('SELECT * FROM lines ORDER BY name'),vs=rows('SELECT * FROM vehicles');$('dashboard').innerHTML=`<div class="head"><div><h1>لوحة التحكم</h1><p>بيانات موقف العربيات محفوظة في SQLite داخل المتصفح</p></div><button class="btn dark" onclick="printReport()">🖨️ طباعة كشف</button></div><div class="stats"><div class="stat"><div class="label">عدد خطوط السير</div><div class="value">${ls.length}</div></div><div class="stat"><div class="label">عدد العربيات</div><div class="value">${vs.length}</div></div><div class="stat"><div class="label">متوسط العربيات لكل خط</div><div class="value">${ls.length?(vs.length/ls.length).toFixed(1):0}</div></div></div><div class="card"><h2>العربيات حسب خط السير</h2><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>اسم خط السير</th><th>عدد العربيات</th></tr></thead><tbody>${ls.map((l,i)=>`<tr><td>${i+1}</td><td><b>${esc(l.name)}</b></td><td><span class="badge">${vs.filter(v=>v.line_id===l.id).length}</span></td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا توجد خطوط سير</td></tr>'}</tbody></table></div></div>`}
function lines(){const ls=rows('SELECT * FROM lines ORDER BY name');$('lines').innerHTML=`<div class="head"><div><h1>خطوط السير</h1><p>تعديل الاسم متاح، والحذف فقط لو الخط بدون عربيات</p></div><button class="btn dark" onclick="printReport()">🖨️ طباعة</button></div><form class="card no-print" onsubmit="addLine(event)"><h3 style="margin-top:0">إضافة خط سير</h3><div class="field"><label>اسم خط السير</label><input id="lineName" placeholder="مثال: المصنع - القاهرة"></div><button class="btn blue">+ إضافة الخط</button></form><div class="card"><div class="search no-print"><input id="lineSearch" placeholder="بحث باسم خط السير..." oninput="drawLines()"></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>اسم خط السير</th><th>عدد العربيات</th><th class="no-print">إجراء</th></tr></thead><tbody id="linesBody"></tbody></table></div></div>`;drawLines()}
function drawLines(){const qv=($('lineSearch')?.value||'').toLowerCase();const ls=rows('SELECT * FROM lines ORDER BY name').filter(l=>l.name.toLowerCase().includes(qv));$('linesBody').innerHTML=ls.map((l,i)=>{const n=rows('SELECT COUNT(*) c FROM vehicles WHERE line_id=?',[l.id])[0].c;return `<tr><td>${i+1}</td><td><b>${esc(l.name)}</b></td><td><span class="badge">${n}</span></td><td class="no-print"><button class="btn gray" onclick="editLine('${l.id}')">✏️ تعديل</button> <button class="btn red" onclick="deleteLine('${l.id}')">🗑️ حذف</button></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">لا توجد بيانات</td></tr>'}
function addLine(e){e.preventDefault();const n=$('lineName').value.trim();if(!n)return toast('اكتب اسم خط السير');try{db.run('INSERT INTO lines VALUES(?,?)',[id(),n]);saveDB();render();toast('تم إضافة خط السير')}catch(e){toast('اسم خط السير موجود بالفعل')}}
function editLine(i){const l=rows('SELECT * FROM lines WHERE id=?',[i])[0];const n=prompt('تعديل اسم خط السير:',l.name);if(n===null)return;if(!n.trim())return toast('الاسم لا يمكن أن يكون فارغًا');try{db.run('UPDATE lines SET name=? WHERE id=?',[n.trim(),i]);saveDB();render();toast('تم تعديل الخط')}catch(e){toast('اسم الخط موجود بالفعل')}}
function deleteLine(i){const n=rows('SELECT COUNT(*) c FROM vehicles WHERE line_id=?',[i])[0].c;if(n)return toast('لا يمكن حذف الخط لأنه عليه '+n+' عربية');if(confirm('هل تريد حذف خط السير؟')){db.run('DELETE FROM lines WHERE id=?',[i]);saveDB();render();toast('تم حذف الخط')}}
function vehicleForm(v=null){const ls=rows('SELECT * FROM lines ORDER BY name');const x=v||{};return `<div class="grid"><div class="field"><label>اسم الموقف</label><input id="fParking" value="${esc(x.parking_name||'')}"></div><div class="field"><label>رقم السيارة</label><input id="fPlate" value="${esc(x.plate_number||'')}" placeholder="مثال: أ ب ج 1234 أو ABC1234"></div><div class="field"><label>مالك السيارة</label><input id="fOwner" value="${esc(x.owner_name||'')}"></div><div class="field"><label>رقم الشاسيه</label><input id="fChassis" value="${esc(x.chassis||'')}"></div><div class="field"><label>خط السير</label><select id="fLine"><option value="">-- بدون خط --</option>${ls.map(l=>`<option value="${l.id}" ${x.line_id===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>رقم التليفون</label><input id="fPhone" value="${esc(x.phone||'')}" type="tel"></div><div class="field"><label>الكارتة المجمعة</label><input id="fCard" value="${esc(x.card_no||'')}"></div><div class="field"><label>عدد الركاب</label><input id="fPassengers" value="${esc(x.passengers||'')}" type="number" min="0"></div><div class="field"><label>صورة رخصة العربية</label><input id="fLicense" type="file" accept="image/*"><div class="note">اختياري — JPG / PNG</div></div></div>`}
function vehicles(){const vs=rows('SELECT * FROM vehicles ORDER BY plate_number');$('vehicles').innerHTML=`<div class="head"><div><h1>العربيات</h1><p>رقم السيارة الآن خانة واحدة وتقبل الحروف والأرقام. كل الحقول اختيارية.</p></div><button class="btn dark" onclick="printReport()">🖨️ طباعة كشف كامل</button></div><form class="card no-print" onsubmit="addVehicle(event)"><h3 style="margin-top:0">إضافة عربية</h3><div class="note">مش لازم تملى أي خانة. اكتب المتاح فقط.</div>${vehicleForm()}<button class="btn blue">+ إضافة العربية</button></form><div class="card"><div class="search no-print"><input id="vehicleSearch" placeholder="بحث برقم السيارة أو المالك أو الشاسيه أو الخط..." oninput="drawVehicles()"></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>الموقف</th><th>رقم السيارة</th><th>المالك</th><th>الشاسيه</th><th>خط السير</th><th>التليفون</th><th>الكارتة</th><th>الركاب</th><th>الرخصة</th><th class="no-print">إجراء</th></tr></thead><tbody id="vehiclesBody"></tbody></table></div></div>`;drawVehicles()}
function lineName(i){return rows('SELECT name FROM lines WHERE id=?',[i])[0]?.name||'بدون خط'}
function drawVehicles(){const qv=($('vehicleSearch')?.value||'').toLowerCase();const vs=rows('SELECT * FROM vehicles ORDER BY plate_number').filter(v=>(Object.values(v).join(' ')+' '+lineName(v.line_id)).toLowerCase().includes(qv));$('vehiclesBody').innerHTML=vs.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.parking_name||'-')}</td><td><b>${esc(v.plate_number||'-')}</b></td><td>${esc(v.owner_name||'-')}</td><td>${esc(v.chassis||'-')}</td><td>${esc(lineName(v.line_id))}</td><td>${esc(v.phone||'-')}</td><td>${esc(v.card_no||'-')}</td><td>${esc(v.passengers||'-')}</td><td>${v.license_image?`<button class="btn gray" onclick="viewLicense('${v.id}')">📷 عرض</button>`:'-'}</td><td class="no-print"><button class="btn gray" onclick="editVehicle('${v.id}')">✏️ تعديل</button> <button class="btn red" onclick="deleteVehicle('${v.id}')">🗑️ حذف</button></td></tr>`).join('')||'<tr><td colspan="11" class="empty">لا توجد عربيات</td></tr>'}
function readImage(file){return new Promise((res,rej)=>{if(!file)return res('');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1200,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function addVehicle(e){e.preventDefault();const file=$('fLicense').files[0];const img=await readImage(file);const v=[id(),$('fParking').value.trim(),$('fPlate').value.trim(),$('fOwner').value.trim(),$('fChassis').value.trim(),$('fLine').value,$('fPhone').value.trim(),$('fCard').value.trim(),$('fPassengers').value,img];try{db.run('INSERT INTO vehicles VALUES(?,?,?,?,?,?,?,?,?,?)',v);saveDB();render();toast('تم إضافة العربية بنجاح')}catch(e){toast('تعذر حفظ العربية')}}
async function editVehicle(i){const v=rows('SELECT * FROM vehicles WHERE id=?',[i])[0];$('modal').innerHTML=`<div class="modal-box"><div class="modal-head"><h2>تعديل بيانات العربية</h2><button class="close" onclick="closeModal()">✕</button></div><div class="note">كل الحقول اختيارية. يمكنك تعديل رقم السيارة أو أي بيان وإضافة صورة رخصة.</div>${vehicleForm(v)}<div class="actions" style="margin-top:10px"><button class="btn blue" onclick="saveEdit('${i}')">💾 حفظ التعديلات</button><button class="btn gray" onclick="closeModal()">إلغاء</button></div></div>`;$('modal').classList.remove('hidden');if(v.license_image)$('fLicense').insertAdjacentHTML('afterend',`<img class="license" src="${v.license_image}">`)}
async function saveEdit(i){const file=$('fLicense').files[0];const img=file?await readImage(file):rows('SELECT license_image FROM vehicles WHERE id=?',[i])[0].license_image;db.run('UPDATE vehicles SET parking_name=?,plate_number=?,owner_name=?,chassis=?,line_id=?,phone=?,card_no=?,passengers=?,license_image=? WHERE id=?',[$('fParking').value.trim(),$('fPlate').value.trim(),$('fOwner').value.trim(),$('fChassis').value.trim(),$('fLine').value,$('fPhone').value.trim(),$('fCard').value.trim(),$('fPassengers').value,img,i]);saveDB();closeModal();render();toast('تم حفظ التعديلات')}
function deleteVehicle(i){if(confirm('هل تريد حذف العربية؟')){db.run('DELETE FROM vehicles WHERE id=?',[i]);saveDB();render();toast('تم حذف العربية')}}function viewLicense(i){const v=rows('SELECT * FROM vehicles WHERE id=?',[i])[0];$('modal').innerHTML=`<div class="modal-box" style="text-align:center"><div class="modal-head"><h2>رخصة العربية</h2><button class="close" onclick="closeModal()">✕</button></div><img src="${v.license_image}" style="max-width:100%;max-height:70vh;border-radius:10px"></div>`;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function printReport(){const ls=rows('SELECT * FROM lines ORDER BY name'),vs=rows('SELECT * FROM vehicles ORDER BY plate_number');const w=window.open('','_blank');if(!w)return toast('اسمح بالنوافذ المنبثقة للطباعة');const lineRows=ls.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}</td><td>${vs.filter(v=>v.line_id===l.id).length}</td></tr>`).join('');const carRows=vs.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.parking_name||'-')}</td><td>${esc(v.plate_number||'-')}</td><td>${esc(v.owner_name||'-')}</td><td>${esc(v.chassis||'-')}</td><td>${esc(lineName(v.line_id))}</td><td>${esc(v.phone||'-')}</td><td>${esc(v.card_no||'-')}</td><td>${esc(v.passengers||'-')}</td></tr>`).join('');w.document.write(`<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>كشف موقف العربيات</title><style>body{font-family:Tahoma;margin:20px}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #999;padding:6px;font-size:11px;text-align:right}th{background:#eee}</style></head><body><h1>نظام إدارة موقف العربيات</h1><p>عدد الخطوط: ${ls.length} — عدد العربيات: ${vs.length}</p><h2>العربيات لكل خط</h2><table><tr><th>#</th><th>خط السير</th><th>عدد العربيات</th></tr>${lineRows}</table><h2>كشف العربيات</h2><table><tr><th>#</th><th>الموقف</th><th>رقم السيارة</th><th>المالك</th><th>الشاسيه</th><th>خط السير</th><th>التليفون</th><th>الكارتة</th><th>الركاب</th></tr>${carRows}</table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
(async()=>{try{await initDB();if(sessionStorage.getItem('parking_login')==='1'){login()}else{$('login').classList.remove('hidden')}}catch(e){console.error(e);$('err').textContent='تعذر تشغيل قاعدة البيانات. افتح الصفحة مع اتصال بالإنترنت.'}})();
</script></body></html>
