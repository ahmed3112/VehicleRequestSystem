<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>موقف العربيات</title><script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script><style>body{font-family:Tahoma;background:#f5f7fb;margin:0;color:#172033}header{background:#0f172a;color:white;padding:14px;display:flex;gap:12px;align-items:center}main{max-width:1400px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 5px 20px #0001}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #ddd}button{cursor:pointer;font-weight:bold}.blue{background:#2563eb;color:white;border:0}.red{background:#fee2e2;color:#b91c1c;border:0}.dark{background:#0f172a;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:right}.table th{background:#f8fafc}.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(400px,90%)}.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center}.modal>div{background:white;padding:20px;border-radius:15px;width:min(700px,90%)}@media(max-width:700px){.grid{grid-template-columns:1fr}header{overflow:auto;white-space:nowrap}.table{min-width:1000px}.scroll{overflow:auto}}@media print{header,.no-print{display:none!important}}</style><body><div id="login" class="login"><div class="card"><h2>🚗 نظام إدارة موقف العربيات</h2><input id="u" placeholder="اسم المستخدم" value="admin"><br><br><input id="p" type="password" placeholder="كلمة المرور"><br><br><button class="blue" style="width:100%" onclick="login()">دخول</button><p id="err"></p></div></div><div id="app" class="hidden"><header><b>🚗 موقف العربيات</b><button onclick="page('home')">الرئيسية</button><button onclick="page('lines')">خطوط السير</button><button onclick="page('cars')">العربيات</button><button onclick="printReport()">🖨️ طباعة</button><button class="red" onclick="location.reload()">خروج</button></header><main><section id="home"></section><section id="lines" class="hidden"></section><section id="cars" class="hidden"></section></main></div><div id="modal" class="modal hidden"></div><script>let db;const $=x=>document.getElementById(x),ID=()=>crypto.randomUUID();async function init(){const SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/'+f});let s=localStorage.db;if(s)db=new SQL.Database(new Uint8Array(JSON.parse(s)));else{db=new SQL.Database();db.run('CREATE TABLE lines(id TEXT PRIMARY KEY,name TEXT UNIQUE);CREATE TABLE cars(id TEXT PRIMARY KEY,parking TEXT,plate TEXT,owner TEXT,chassis TEXT,line TEXT,phone TEXT,card TEXT,passengers TEXT,license TEXT)'}save()}function save(){localStorage.db=JSON.stringify([...db.export()])}function rows(q,a=[]){let r=db.exec(q,a)[0];return r?r.values.map(x=>Object.fromEntries(r.columns.map((c,i)=>[c,x[i]]))):[]}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function login(){if($('u').value==='admin'&&$('p').value==='Admin@123'){$('login').classList.add('hidden');$('app').classList.remove('hidden');page('home')}else $('err').textContent='بيانات الدخول غير صحيحة'}function page(x){['home','lines','cars'].forEach(y=>$(y).classList.toggle('hidden',y!==x));render()}function render(){home();linePage();carPage()}function home(){let l=rows('select * from lines'),c=rows('select * from cars');$('home').innerHTML='<div class="card"><h1>لوحة التحكم</h1><div class="grid"><div><b>خطوط السير</b><h2>'+l.length+'</h2></div><div><b>العربيات</b><h2>'+c.length+'</h2></div></div></div><div class="card"><h2>العربيات حسب الخط</h2><table class="table"><tr><th>الخط</th><th>عدد العربيات</th></tr>'+l.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+c.filter(v=>v.line===x.id).length+'</td></tr>').join('')+'</table></div>'}function linePage(){$('lines').innerHTML='<div class="card"><h2>خطوط السير</h2><input id="ln" placeholder="اسم خط السير"> <button class="blue" onclick="addLine()">+ إضافة</button></div><div class="card scroll"><table class="table"><tr><th>اسم الخط</th><th>العربيات</th><th>إجراء</th></tr>'+rows('select * from lines order by name').map(l=>'<tr><td>'+esc(l.name)+'</td><td>'+rows('select count(*) n from cars where line=?',[l.id])[0].n+'</td><td><button onclick="editLine(\''+l.id+'\')">✏️</button> <button class="red" onclick="delLine(\''+l.id+'\')">🗑️</button></td></tr>').join('')+'</table></div>'}function addLine(){let n=$('ln').value.trim();if(!n)return;if(rows('select * from lines where name=?',[n]).length)return alert('الخط موجود');db.run('insert into lines values(?,?)',[ID(),n]);save();render()}function editLine(id){let l=rows('select * from lines where id=?',[id])[0],n=prompt('اسم الخط',l.name);if(n&&n.trim()){db.run('update lines set name=? where id=?',[n.trim(),id]);save();render()}}function delLine(id){if(rows('select * from cars where line=?',[id]).length)return alert('لا يمكن حذف خط عليه عربيات');if(confirm('حذف الخط؟')){db.run('delete from lines where id=?',[id]);save();render()}}function form(c={}){return '<div class="grid"><div class="field"><label>اسم الموقف</label><input id="fparking" value="'+esc(c.parking)+'"></div><div class="field"><label>رقم السيارة</label><input id="fplate" value="'+esc(c.plate)+'" placeholder="حروف وأرقام"></div><div class="field"><label>مالك السيارة</label><input id="fowner" value="'+esc(c.owner)+'"></div><div class="field"><label>رقم الشاسيه</label><input id="fchassis" value="'+esc(c.chassis)+'"></div><div class="field"><label>خط السير</label><select id="fline"><option value="">-- بدون خط --</option>'+rows('select * from lines order by name').map(l=>'<option value="'+l.id+'" '+(c.line===l.id?'selected':'')+'>'+esc(l.name)+'</option>').join('')+'</select></div><div class="field"><label>رقم التليفون</label><input id="fphone" value="'+esc(c.phone)+'"></div><div class="field"><label>الكارتة المجمعة</label><input id="fcard" value="'+esc(c.card)+'"></div><div class="field"><label>عدد الركاب</label><input id="fpass" type="number" value="'+esc(c.passengers)+'"></div><div class="field"><label>صورة رخصة العربية</label><input id="flic" type="file" accept="image/*"></div></div>'}async function image(f){return new Promise(r=>{if(!f)return r('');let x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)})}function carPage(){$('cars').innerHTML='<div class="card"><h2>إضافة عربية</h2>'+form()+'<br><button class="blue" onclick="addCar()">+ إضافة العربية</button></div><div class="card scroll"><input id="search" placeholder="بحث..." oninput="drawCars()"><table class="table"><thead><tr><th>رقم السيارة</th><th>الموقف</th><th>المالك</th><th>الشاسيه</th><th>الخط</th><th>الرخصة</th><th>إجراء</th></tr></thead><tbody id="ct"></tbody></table></div>';drawCars()}function drawCars(){let q=($('search')?.value||'').toLowerCase(),a=rows('select * from cars order by plate').filter(c=>(Object.values(c).join(' ')).toLowerCase().includes(q));$('ct').innerHTML=a.map(c=>'<tr><td><b>'+esc(c.plate||'-')+'</b></td><td>'+esc(c.parking||'-')+'</td><td>'+esc(c.owner||'-')+'</td><td>'+esc(c.chassis||'-')+'</td><td>'+esc(rows('select name from lines where id=?',[c.line])[0]?.name||'بدون خط')+'</td><td>'+(c.license?'<button onclick="view(\''+c.id+'\')">📷</button>':'-')+'</td><td><button onclick="editCar(\''+c.id+'\')">✏️</button> <button class="red" onclick="delCar(\''+c.id+'\')">🗑️</button></td></tr>').join('')||'<tr><td colspan="7">لا توجد عربيات</td></tr>'}async function vals(c={}){return[c.id||ID(),$('fparking').value.trim(),$('fplate').value.trim(),$('fowner').value.trim(),$('fchassis').value.trim(),$('fline').value,$('fphone').value.trim(),$('fcard').value.trim(),$('fpass').value,await image($('flic').files[0])||c.license||'']}async function addCar(){db.run('insert into cars values(?,?,?,?,?,?,?,?,?,?)',await vals());save();render()}async function editCar(id){let c=rows('select * from cars where id=?',[id])[0];$('modal').innerHTML='<div><button onclick="closeM()">✕</button><h2>تعديل العربية</h2>'+form(c)+'<button class="blue" onclick="saveCar(\''+id+'\')">حفظ</button></div>';$('modal').classList.remove('hidden')}async function saveCar(id){db.run('delete from cars where id=?',[id]);db.run('insert into cars values(?,?,?,?,?,?,?,?,?,?)',await vals({id,license:rows('select license from cars where id=?',[id])[0]?.license}));save();closeM();render()}function delCar(id){if(confirm('حذف العربية؟')){db.run('delete from cars where id=?',[id]);save();render()}}function view(id){let c=rows('select license from cars where id=?',[id])[0];$('modal').innerHTML='<div><button onclick="closeM()">✕</button><h2>رخصة العربية</h2><img src="'+c.license+'" style="max-width:100%"></div>';$('modal').classList.remove('hidden')}function closeM(){$('modal').classList.add('hidden')}function printReport(){let l=rows('select * from lines'),c=rows('select * from cars');let w=open('','_blank');w.document.write('<html dir="rtl"><body><h1>كشف موقف العربيات</h1><table border="1" style="width:100%;border-collapse:collapse"><tr><th>رقم السيارة</th><th>الموقف</th><th>المالك</th><th>الشاسيه</th><th>خط السير</th></tr>'+c.map(x=>'<tr><td>'+esc(x.plate)+'</td><td>'+esc(x.parking)+'</td><td>'+esc(x.owner)+'</td><td>'+esc(x.chassis)+'</td><td>'+esc(rows('select name from lines where id=?',[x.line])[0]?.name||'بدون خط')+'</td></tr>').join('')+'</table><script>onload=()=>print()<\\/script></body></html>');w.document.close()}init();</script></body></html>
