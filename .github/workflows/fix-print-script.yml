name: Fix print script
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix embedded print script closing tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script>window.onload=()=>window.print();</script>'
          new = '<script>window.onload=()=>window.print();<\\/script>'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          else:
              print('No broken print script found; nothing to change.')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix embedded print script'
          git push