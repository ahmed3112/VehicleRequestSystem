<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>نظام إدارة موقف العربيات</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}.hidden{display:none!important}button,input,select{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eaf2ff,#f8fafc)}.login-card{width:min(420px,100%);background:#fff;border-radius:24px;padding:32px;box-shadow:0 20px 55px #0f172a22}.icon{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:#1758d1;color:#fff;font-size:38px}.login-card h1{text-align:center;font-size:25px;margin:0 0 8px}.sub{text-align:center;color:#64748b;margin:0 0 25px}.field{margin-bottom:14px}.field label{display:block;font-weight:700;margin-bottom:7px;font-size:14px}input,select{width:100%;padding:12px 13px;border:1px solid #d9e0e8;border-radius:10px;background:#fff;outline:none}input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}.primary{width:100%;border:0;border-radius:10px;padding:13px;background:#2563eb;color:#fff;font-weight:700}.err{text-align:center;color:#dc2626;min-height:20px;margin-top:10px}.top{background:#0f172a;color:#fff;position:sticky;top:0;z-index:20}.topin{max-width:1450px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:18px}.brand{font-weight:800;white-space:nowrap}.nav{display:flex;gap:5px;flex:1}.nav button{border:0;background:transparent;color:#cbd5e1;padding:10px 13px;border-radius:8px}.nav button.active,.nav button:hover{background:#1e293b;color:#fff}.logout{border:0;background:#b91c1c;color:#fff;border-radius:8px;padding:9px 13px}.wrap{max-width:1450px;margin:auto;padding:25px 18px 45px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.head h1{margin:0;font-size:27px}.head p{margin:5px 0 0;color:#64748b}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.blue{background:#2563eb;color:#fff}.dark{background:#0f172a;color:#fff}.red{background:#fee2e2;color:#b91c1c}.gray{background:#e2e8f0;color:#172033}.green{background:#dcfce7;color:#166534}.card{background:#fff;border:1px solid #e5eaf0;border-radius:15px;padding:19px;margin-bottom:17px;box-shadow:0 6px 22px #0f172a0a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e5eaf0;border-radius:15px;padding:19px}.label{color:#64748b;font-size:14px}.value{font-size:32px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.search{margin-bottom:13px}.table-wrap{overflow:auto;border:1px solid #e1e7ee;border-radius:11px}.table{width:100%;min-width:1100px;border-collapse:collapse}.table th,.table td{padding:11px 10px;border-bottom:1px solid #edf0f4;text-align:right;white-space:nowrap}.table th{background:#f8fafc;color:#475569;font-size:13px}.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 9px;border-radius:20px;font-weight:800}.empty{text-align:center;color:#64748b;padding:30px}.toast{position:fixed;bottom:20px;left:20px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s;z-index:99}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:15px;z-index:50}.modal-box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0}.close{border:0;background:#f1f5f9;border-radius:9px;padding:8px 12px}.license{border:1px dashed #94a3b8;border-radius:11px;padding:12px;background:#f8fafc}.license img{max-width:180px;max-height:130px;border-radius:8px;display:block;margin-top:8px}.small{font-size:12px;color:#64748b}.required-note{font-size:12px;color:#64748b;margin-bottom:15px}
@media(max-width:700px){.topin{gap:8px;padding:10px}.brand{font-size:14px}.nav{overflow:auto}.nav button{white-space:nowrap;padding:8px}.wrap{padding:18px 11px}.head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.actions,.actions button{width:100%}.actions{flex-direction:column}}
@media print{body{background:#fff}.top,.no-print,.actions,#login,.toast,.modal{display:none!important}.wrap{padding:0}.card{border:0;box-shadow:none;padding:0}.table-wrap{border:1px solid #222}.table{min-width:0}.table th,.table td{border:1px solid #aaa;font-size:10px;padding:6px}}
</style>
</head>
<body>
<section id="login" class="login"><div class="login-card"><div class="icon">🚗</div><h1>نظام إدارة موقف العربيات</h1><p class="sub">تسجيل الدخول إلى النظام</p><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username" placeholder="اسم المستخدم"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div><button class="primary" onclick="login()">دخول إلى النظام</button><div id="err" class="err"></div></div></section>
<div id="app" class="hidden"><header class="top"><div class="topin"><div class="brand">🚗 موقف العربيات</div><nav class="nav"><button id="nDashboard" onclick="show('dashboard')">الرئيسية</button><button id="nLines" onclick="show('lines')">خطوط السير</button><button id="nVehicles" onclick="show('vehicles')">العربيات</button></nav><button class="logout" onclick="logout()">خروج</button></div></header><main class="wrap"><div id="dashboard"></div><div id="lines" class="hidden"></div><div id="vehicles" class="hidden"></div></main></div><div id="toast" class="toast"></div><div id="modal" class="modal hidden"></div>
<script>
'use strict';
const USER='admin',PASS='Admin@123',KEY='parking_management_final_v3';
let data=JSON.parse(localStorage.getItem(KEY)||'null');
if(!data){try{data=JSON.parse(localStorage.getItem('parking_management_final_v2')||'null')}catch(e){}data=data||{lines:[],vehicles:[]};}
const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2300)}function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function login(){if($('username').value.trim()===USER&&$('password').value===PASS){sessionStorage.setItem('parking_login','1');$('login').classList.add('hidden');$('app').classList.remove('hidden');show('dashboard')}else $('err').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});function logout(){sessionStorage.removeItem('parking_login');location.reload()}
function show(id){['dashboard','lines','vehicles'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('n'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('active');render()}
function lineName(id){return data.lines.find(x=>x.id===id)?.name||'بدون خط'}function render(){dashboard();lines();vehicles()}
function dashboard(){$('dashboard').innerHTML=`<div class="head"><div><h1>لوحة التحكم</h1><p>ملخص موقف العربيات وخطوط السير</p></div><div class="actions"><button class="btn dark" onclick="printReport()">🖨️ طباعة كشف</button></div></div><div class="stats"><div class="stat"><div class="label">عدد خطوط السير</div><div class="value">${data.lines.length}</div></div><div class="stat"><div class="label">عدد العربيات</div><div class="value">${data.vehicles.length}</div></div><div class="stat"><div class="label">متوسط العربيات لكل خط</div><div class="value">${data.lines.length?(data.vehicles.length/data.lines.length).toFixed(1):0}</div></div></div><div class="card"><h2>العربيات حسب خط السير</h2><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>اسم خط السير</th><th>عدد العربيات</th></tr></thead><tbody>${data.lines.map((l,i)=>`<tr><td>${i+1}</td><td><b>${esc(l.name)}</b></td><td><span class="badge">${data.vehicles.filter(v=>v.lineId===l.id).length}</span></td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا توجد خطوط سير</td></tr>'}</tbody></table></div></div>`}
function lines(){$('lines').innerHTML=`<div class="head"><div><h1>خطوط السير</h1><p>تقدر تعدل اسم الخط أو تحذفه إذا لم يكن عليه أي عربية</p></div><div class="actions"><button class="btn dark" onclick="printReport()">🖨️ طباعة</button></div></div><form class="card no-print" onsubmit="addLine(event)"><h3 style="margin-top:0">إضافة خط سير</h3><div class="field"><label>اسم خط السير</label><input id="lineName" placeholder="مثال: المصنع - القاهرة"></div><button class="btn blue">+ إضافة الخط</button></form><div class="card"><div class="search no-print"><input id="lineSearch" placeholder="بحث باسم خط السير..." oninput="drawLines()"></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>اسم خط السير</th><th>عدد العربيات</th><th class="no-print">إجراء</th></tr></thead><tbody id="linesBody"></tbody></table></div></div>`;drawLines()}
function drawLines(){const q=($('lineSearch')?.value||'').toLowerCase();const rows=data.lines.filter(l=>l.name.toLowerCase().includes(q));$('linesBody').innerHTML=rows.map((l,i)=>`<tr><td>${i+1}</td><td><b>${esc(l.name)}</b></td><td><span class="badge">${data.vehicles.filter(v=>v.lineId===l.id).length}</span></td><td class="no-print"><button class="btn gray" onclick="editLine('${l.id}')">✏️ تعديل</button> <button class="btn red" onclick="deleteLine('${l.id}')">🗑️ حذف</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد بيانات</td></tr>'}
function addLine(e){e.preventDefault();const name=$('lineName').value.trim();if(!name)return toast('اكتب اسم خط السير');if(data.lines.some(l=>l.name===name))return toast('خط السير موجود بالفعل');data.lines.push({id:uid(),name});save();render();toast('تم إضافة خط السير')}
function editLine(id){const l=data.lines.find(x=>x.id===id);if(!l)return;const name=prompt('تعديل اسم خط السير:',l.name);if(name===null)return;const n=name.trim();if(!n)return toast('اسم الخط لا يمكن أن يكون فارغًا');if(data.lines.some(x=>x.id!==id&&x.name===n))return toast('اسم الخط موجود بالفعل');l.name=n;save();render();toast('تم تعديل اسم الخط')}
function deleteLine(id){const count=data.vehicles.filter(v=>v.lineId===id).length;if(count>0)return toast('لا يمكن حذف الخط لأنه عليه '+count+' عربية');if(confirm('هل تريد حذف خط السير؟')){data.lines=data.lines.filter(l=>l.id!==id);save();render();toast('تم حذف الخط')}}
function vehicles(){$('vehicles').innerHTML=`<div class="head"><div><h1>العربيات</h1><p>كل البيانات اختيارية ويمكنك تعديل العربية في أي وقت</p></div><div class="actions"><button class="btn dark" onclick="printReport()">🖨️ طباعة كشف كامل</button></div></div><form class="card no-print" onsubmit="addVehicle(event)"><h3 style="margin-top:0">إضافة عربية</h3><div class="required-note">لا يوجد أي حقل إجباري. املأ البيانات المتاحة فقط.</div><div class="grid"><div class="field"><label>اسم الموقف</label><input id="parkingName"></div><div class="field"><label>رقم السيارة</label><input id="plateNumber"></div><div class="field"><label>حروف وأرقام</label><input id="plateLettersNumbers"></div><div class="field"><label>مالك السيارة</label><input id="ownerName"></div><div class="field"><label>رقم الشاسيه</label><input id="chassis"></div><div class="field"><label>خط السير</label><select id="lineId"><option value="">-- بدون خط --</option>${data.lines.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>رقم التليفون</label><input id="phone" type="tel"></div><div class="field"><label>الكارتة المجمعة</label><input id="cardNo"></div><div class="field"><label>عدد الركاب</label><input id="passengers" type="number" min="0"></div><div class="field"><label>صورة رخصة العربية</label><input id="license" type="file" accept="image/*" onchange="previewNewLicense(event)"><div id="newLicensePreview" class="small">اختياري — JPG / PNG</div></div></div><button class="btn blue">+ إضافة العربية</button></form><div class="card"><div class="search no-print"><input id="vehicleSearch" placeholder="بحث برقم السيارة أو المالك أو الشاسيه أو الخط..." oninput="drawVehicles()"></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>الموقف</th><th>رقم السيارة</th><th>حروف وأرقام</th><th>المالك</th><th>الشاسيه</th><th>خط السير</th><th>التليفون</th><th>الكارتة</th><th>الركاب</th><th>الرخصة</th><th class="no-print">إجراء</th></tr></thead><tbody id="vehiclesBody"></tbody></table></div></div>`;drawVehicles()}
let newLicense='';function previewNewLicense(e){compressImage(e.target.files[0]).then(x=>{newLicense=x;$('newLicensePreview').innerHTML=x?'<img class="license" style="max-width:180px" src="'+x+'">':'اختياري — JPG / PNG'}).catch(()=>toast('تعذر قراءة الصورة'))}
function drawVehicles(){const q=($('vehicleSearch')?.value||'').toLowerCase();const rows=data.vehicles.filter(v=>Object.values(v).join(' ').toLowerCase().includes(q)||lineName(v.lineId).toLowerCase().includes(q));$('vehiclesBody').innerHTML=rows.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.parkingName||'-')}</td><td><b>${esc(v.plateNumber||'-')}</b></td><td>${esc(v.plateLettersNumbers||'-')}</td><td>${esc(v.ownerName||'-')}</td><td>${esc(v.chassis||'-')}</td><td>${esc(lineName(v.lineId))}</td><td>${esc(v.phone||'-')}</td><td>${esc(v.cardNo||'-')}</td><td>${esc(v.passengers||'-')}</td><td>${v.licenseImage?'<button class="btn gray" onclick="viewLicense(\''+v.id+'\')">📷 عرض</button>':'-'}</td><td class="no-print"><button class="btn gray" onclick="editVehicle('${v.id}')">✏️ تعديل</button> <button class="btn red" onclick="deleteVehicle('${v.id}')">🗑️ حذف</button></td></tr>`).join('')||'<tr><td colspan="12" class="empty">لا توجد عربيات</td></tr>'}
function addVehicle(e){e.preventDefault();const v={id:uid(),parkingName:$('parkingName').value.trim(),plateNumber:$('plateNumber').value.trim(),plateLettersNumbers:$('plateLettersNumbers').value.trim(),ownerName:$('ownerName').value.trim(),chassis:$('chassis').value.trim(),lineId:$('lineId').value,phone:$('phone').value.trim(),cardNo:$('cardNo').value.trim(),passengers:$('passengers').value,licenseImage:newLicense};if(v.plateNumber&&data.vehicles.some(x=>x.plateNumber===v.plateNumber))return toast('رقم السيارة موجود بالفعل');data.vehicles.push(v);save();newLicense='';render();toast('تم إضافة العربية بنجاح')}
function deleteVehicle(id){if(confirm('هل تريد حذف العربية؟')){data.vehicles=data.vehicles.filter(v=>v.id!==id);save();render();toast('تم حذف العربية')}}
function editVehicle(id){const v=data.vehicles.find(x=>x.id===id);if(!v)return;let selected=v.lineId||'';$('modal').innerHTML=`<div class="modal-box"><div class="modal-head"><h2>تعديل بيانات العربية</h2><button class="close" onclick="closeModal()">✕</button></div><div class="required-note">كل الحقول اختيارية. يمكنك تغيير أي بيانات أو إضافة/استبدال صورة الرخصة.</div><div class="grid"><div class="field"><label>اسم الموقف</label><input id="eParking" value="${esc(v.parkingName)}"></div><div class="field"><label>رقم السيارة</label><input id="ePlate" value="${esc(v.plateNumber)}"></div><div class="field"><label>حروف وأرقام</label><input id="eLetters" value="${esc(v.plateLettersNumbers)}"></div><div class="field"><label>مالك السيارة</label><input id="eOwner" value="${esc(v.ownerName)}"></div><div class="field"><label>رقم الشاسيه</label><input id="eChassis" value="${esc(v.chassis)}"></div><div class="field"><label>خط السير</label><select id="eLine"><option value="">-- بدون خط --</option>${data.lines.map(l=>`<option value="${l.id}" ${l.id===selected?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>رقم التليفون</label><input id="ePhone" value="${esc(v.phone)}"></div><div class="field"><label>الكارتة المجمعة</label><input id="eCard" value="${esc(v.cardNo)}"></div><div class="field"><label>عدد الركاب</label><input id="ePassengers" type="number" min="0" value="${esc(v.passengers)}"></div><div class="field"><label>صورة رخصة العربية</label><input id="eLicense" type="file" accept="image/*" onchange="editLicense(event)"><div id="editLicensePreview">${v.licenseImage?'<img class="license" src="'+v.licenseImage+'">':'<span class="small">لا توجد صورة مرفقة</span>'}</div></div></div><div class="actions" style="margin-top:12px"><button class="btn blue" onclick="saveVehicleEdit('${id}')">💾 حفظ التعديلات</button><button class="btn gray" onclick="closeModal()">إلغاء</button></div></div>`;$('modal').classList.remove('hidden');window.editImg=v.licenseImage||''}
function editLicense(e){compressImage(e.target.files[0]).then(x=>{window.editImg=x||window.editImg;$('editLicensePreview').innerHTML=x?'<img class="license" src="'+x+'">':'<span class="small">لا توجد صورة مرفقة</span>'}).catch(()=>toast('تعذر قراءة الصورة'))}
function saveVehicleEdit(id){const v=data.vehicles.find(x=>x.id===id);const plate=$('ePlate').value.trim();if(plate&&data.vehicles.some(x=>x.id!==id&&x.plateNumber===plate))return toast('رقم السيارة موجود بالفعل');Object.assign(v,{parkingName:$('eParking').value.trim(),plateNumber:plate,plateLettersNumbers:$('eLetters').value.trim(),ownerName:$('eOwner').value.trim(),chassis:$('eChassis').value.trim(),lineId:$('eLine').value,phone:$('ePhone').value.trim(),cardNo:$('eCard').value.trim(),passengers:$('ePassengers').value,licenseImage:window.editImg||''});save();closeModal();render();toast('تم حفظ التعديلات')}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}function viewLicense(id){const v=data.vehicles.find(x=>x.id===id);if(!v?.licenseImage)return;$('modal').innerHTML=`<div class="modal-box" style="text-align:center"><div class="modal-head"><h2>رخصة العربية</h2><button class="close" onclick="closeModal()">✕</button></div><img src="${v.licenseImage}" style="max-width:100%;max-height:70vh;border-radius:10px"><div style="margin-top:12px"><button class="btn gray" onclick="closeModal()">إغلاق</button></div></div>`;$('modal').classList.remove('hidden')}
function compressImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(!file.type.startsWith('image/'))return reject();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function printReport(){const w=window.open('','_blank','width=1100,height=800');if(!w)return toast('اسمح بالنوافذ المنبثقة للطباعة');const rows=data.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}</td><td>${data.vehicles.filter(v=>v.lineId===l.id).length}</td></tr>`).join('');const detail=data.lines.map((l,li)=>{const cars=data.vehicles.filter(v=>v.lineId===l.id);return `<tr><th colspan="9" style="background:#e5e7eb">${li+1} - ${esc(l.name)} — عدد العربيات: ${cars.length}</th></tr>`+cars.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.parkingName||'-')}</td><td>${esc(v.plateNumber||'-')}</td><td>${esc(v.plateLettersNumbers||'-')}</td><td>${esc(v.ownerName||'-')}</td><td>${esc(v.chassis||'-')}</td><td>${esc(v.phone||'-')}</td><td>${esc(v.cardNo||'-')}</td><td>${esc(v.passengers||'-')}</td></tr>`).join('')}).join('');w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>كشف موقف العربيات</title><style>body{font-family:Tahoma,Arial;margin:20px}table{width:100%;border-collapse:collapse;margin:12px 0 22px}th,td{border:1px solid #999;padding:6px;font-size:11px;text-align:right}th{background:#f3f4f6}h1{margin-bottom:5px}.sub{color:#555}</style></head><body><h1>نظام إدارة موقف العربيات</h1><div class="sub">كشف الخطوط والعربيات — ${new Date().toLocaleString('ar-EG')}</div><p><b>عدد الخطوط:</b> ${data.lines.length} &nbsp;&nbsp; <b>عدد العربيات:</b> ${data.vehicles.length}</p><h2>ملخص خطوط السير</h2><table><tr><th>#</th><th>اسم خط السير</th><th>عدد العربيات</th></tr>${rows||'<tr><td colspan="3">لا توجد خطوط</td></tr>'}</table><h2>تفاصيل العربيات</h2><table><tr><th>#</th><th>الموقف</th><th>رقم السيارة</th><th>حروف وأرقام</th><th>المالك</th><th>الشاسيه</th><th>التليفون</th><th>الكارتة</th><th>الركاب</th></tr>${detail||'<tr><td colspan="9">لا توجد عربيات</td></tr>'}</table><p>مسؤول الموقف: ____________________ &nbsp;&nbsp; التوقيع: ____________________</p><script>window.onload=function(){window.print()}</script></body></html>`);w.document.close()}
if(sessionStorage.getItem('parking_login')==='1'){$('login').classList.add('hidden');$('app').classList.remove('hidden');show('dashboard')}
