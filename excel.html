<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>موقف العربيات</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Tahoma,Arial,sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eaf2ff,#f8fafc)}.box,.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0f172a12}.box{width:min(430px,100%)}h1,h2,h3{margin-top:0}.icon{width:70px;height:70px;border-radius:20px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:38px;margin:auto auto 15px}.login h1{text-align:center;font-size:25px}.sub{text-align:center;color:#64748b}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:6px}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #d8e0ea;border-radius:10px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}.primary,.blue{background:#2563eb;color:white}.gray{background:#e2e8f0}.red{background:#fee2e2;color:#b91c1c}.dark{background:#0f172a;color:#fff}.hidden{display:none!important}.top{background:#0f172a;color:#fff;position:sticky;top:0;z-index:5}.topin{max-width:1450px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:10px}.brand{font-weight:bold;margin-left:15px}.nav{display:flex;gap:5px;flex:1}.nav button{background:transparent;color:#cbd5e1}.nav button.active,.nav button:hover{background:#1e293b;color:#fff}.wrap{max-width:1450px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:15px}.muted{color:#64748b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{padding:20px;background:#fff;border-radius:15px;border:1px solid #e5eaf0}.num{font-size:32px;font-weight:bold;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tablewrap{overflow:auto;border:1px solid #e2e8f0;border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:10px;border-bottom:1px solid #edf1f5;text-align:right}.table th{background:#f8fafc}.actions{display:flex;gap:7px;flex-wrap:wrap}.err{color:#dc2626;text-align:center;margin-top:8px}.toast{position:fixed;bottom:20px;left:20px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:20}.toast.show{display:block}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px;z-index:10}.modalbox{background:#fff;width:min(800px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.close{float:left}.license{max-width:250px;max-height:180px;margin-top:8px;border-radius:8px}@media(max-width:700px){.topin{overflow:auto}.brand{white-space:nowrap}.nav{overflow:auto}.nav button{white-space:nowrap}.wrap{padding:12px}.stats,.grid{grid-template-columns:1fr}.head{align-items:stretch;flex-direction:column}.actions button{flex:1}}@media print{.top,.no-print{display:none!important}body{background:#fff}.wrap{padding:0}.card{box-shadow:none;border:0}}
</style></head><body><section id="login" class="login"><div class="box"><div class="icon">🚗</div><h1>نظام إدارة موقف العربيات</h1><p class="sub">تسجيل الدخول إلى النظام</p><div class="field"><label>اسم المستخدم</label><input id="u" value="admin"></div><div class="field"><label>كلمة المرور</label><input id="p" type="password"></div><button class="primary" style="width:100%" onclick="login()">دخول إلى النظام</button><div id="err" class="err"></div></div></section><div id="app" class="hidden"><header class="top"><div class="topin"><div class="brand">🚗 موقف العربيات</div><nav class="nav"><button id="bd" onclick="page('dash')">الرئيسية</button><button id="bl" onclick="page('lines')">خطوط السير</button><button id="bv" onclick="page('cars')">العربيات</button></nav><div class="actions"><button class="gray" onclick="importExcel()">📥 استيراد Excel</button><button class="blue" onclick="exportExcel()">📤 تصدير Excel</button><button class="red" onclick="logout()">خروج</button></div></div></header><main class="wrap"><div id="dash"></div><div id="lines" class="hidden"></div><div id="cars" class="hidden"></div></main></div><input id="file" type="file" accept=".xlsx,.xls,.csv" hidden onchange="readExcel(event)"><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div><script>
const KEY='parking_excel_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"lines":[],"cars":[]}');const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function login(){if($('u').value==='admin'&&$('p').value==='Admin@123'){$('login').classList.add('hidden');$('app').classList.remove('hidden');page('dash')}else $('err').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}$('p').onkeydown=e=>{if(e.key==='Enter')login()};function logout(){location.reload()}function page(x){['dash','lines','cars'].forEach(y=>$(y).classList.toggle('hidden',x!==y));$('bd').classList.toggle('active',x==='dash');$('bl').classList.toggle('active',x==='lines');$('bv').classList.toggle('active',x==='cars');render()}function render(){dash();lines();cars()}
function dash(){const total=data.cars.length,ls=data.lines.length;$('dash').innerHTML=`<div class="head"><div><h1>لوحة التحكم</h1><div class="muted">قاعدة البيانات الحالية محفوظة محليًا ويمكن تصديرها إلى Excel</div></div><button class="dark no-print" onclick="window.print()">🖨️ طباعة</button></div><div class="stats"><div class="stat">عدد خطوط السير<div class="num">${ls}</div></div><div class="stat">عدد العربيات<div class="num">${total}</div></div><div class="stat">متوسط العربيات لكل خط<div class="num">${ls?(total/ls).toFixed(1):0}</div></div></div><div class="card" style="margin-top:16px"><h2>العربيات حسب خط السير</h2><div class="tablewrap"><table class="table"><tr><th>خط السير</th><th>عدد العربيات</th></tr>${data.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${data.cars.filter(c=>c.line===l.id).length}</td></tr>`).join('')||'<tr><td colspan="2">لا توجد بيانات</td></tr>'}</table></div></div>`}
function lines(){ $('lines').innerHTML=`<div class="head"><div><h1>خطوط السير</h1><div class="muted">يمكن تعديل الخط أو حذفه إذا لم توجد عليه عربيات</div></div></div><form class="card no-print" onsubmit="addLine(event)"><div class="field"><label>اسم خط السير</label><input id="ln" placeholder="مثال: المصنع - القاهرة"></div><button class="blue">+ إضافة خط</button></form><div class="card"><div class="tablewrap"><table class="table"><tr><th>#</th><th>اسم الخط</th><th>عدد العربيات</th><th>إجراء</th></tr>${data.lines.map((l,i)=>`<tr><td>${i+1}</td><td><b>${esc(l.name)}</b></td><td>${data.cars.filter(c=>c.line===l.id).length}</td><td><button class="gray" onclick="editLine('${l.id}')">✏️ تعديل</button> <button class="red" onclick="delLine('${l.id}')">🗑️ حذف</button></td></tr>`).join('')||'<tr><td colspan="4">لا توجد خطوط</td></tr>'}</table></div></div>`}function addLine(e){e.preventDefault();const n=$('ln').value.trim();if(!n)return;data.lines.push({id:crypto.randomUUID(),name:n});save();render();toast('تم إضافة الخط')}function editLine(id){const l=data.lines.find(x=>x.id===id),n=prompt('اسم خط السير',l.name);if(n&&n.trim()){l.name=n.trim();save();render()}}function delLine(id){if(data.cars.some(c=>c.line===id))return toast('لا يمكن حذف خط عليه عربيات');if(confirm('حذف خط السير؟')){data.lines=data.lines.filter(l=>l.id!==id);save();render()}}
function form(c={}){return `<div class="grid"><div class="field"><label>اسم الموقف</label><input id="f0" value="${esc(c.parking||'')}"></div><div class="field"><label>رقم السيارة</label><input id="f1" value="${esc(c.plate||'')}" placeholder="حروف وأرقام"></div><div class="field"><label>مالك السيارة</label><input id="f2" value="${esc(c.owner||'')}"></div><div class="field"><label>رقم الشاسيه</label><input id="f3" value="${esc(c.chassis||'')}"></div><div class="field"><label>خط السير</label><select id="f4"><option value="">-- بدون خط --</option>${data.lines.map(l=>`<option value="${l.id}" ${c.line===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>رقم التليفون</label><input id="f5" type="tel" value="${esc(c.phone||'')}"></div><div class="field"><label>الكارتة المجمعة</label><input id="f6" value="${esc(c.card||'')}"></div><div class="field"><label>عدد الركاب</label><input id="f7" type="number" min="0" value="${esc(c.passengers||'')}"></div><div class="field"><label>صورة رخصة العربية</label><input id="f8" type="file" accept="image/*"><small class="muted">اختياري</small>${c.license?`<br><img class="license" src="${c.license}">`:''}</div></div>`}
function cars(){ $('cars').innerHTML=`<div class="head"><div><h1>العربيات</h1><div class="muted">كل الخانات اختيارية — رقم السيارة خانة واحدة تقبل الحروف والأرقام</div></div><button class="dark no-print" onclick="window.print()">🖨️ طباعة</button></div><div class="card no-print"><h3>إضافة عربية</h3>${form()}<button class="blue" onclick="addCar()">+ إضافة العربية</button></div><div class="card"><input id="search" placeholder="بحث برقم السيارة أو المالك أو الشاسيه أو الخط..." oninput="drawCars()" style="margin-bottom:12px"><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>الموقف</th><th>رقم السيارة</th><th>المالك</th><th>الشاسيه</th><th>خط السير</th><th>التليفون</th><th>الكارتة</th><th>الركاب</th><th>الرخصة</th><th>إجراء</th></tr></thead><tbody id="cb"></tbody></table></div></div>`;drawCars()}
function drawCars(){const q=($('search')?.value||'').toLowerCase();const a=data.cars.filter(c=>(Object.values(c).join(' ')+' '+(data.lines.find(l=>l.id===c.line)?.name||'')).toLowerCase().includes(q));$('cb').innerHTML=a.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.parking||'-')}</td><td><b>${esc(c.plate||'-')}</b></td><td>${esc(c.owner||'-')}</td><td>${esc(c.chassis||'-')}</td><td>${esc(data.lines.find(l=>l.id===c.line)?.name||'بدون خط')}</td><td>${esc(c.phone||'-')}</td><td>${esc(c.card||'-')}</td><td>${esc(c.passengers||'-')}</td><td>${c.license?`<button class="gray" onclick="view('${c.id}')">📷 عرض</button>`:'-'}</td><td><button class="gray" onclick="editCar('${c.id}')">✏️ تعديل</button> <button class="red" onclick="delCar('${c.id}')">🗑️ حذف</button></td></tr>`).join('')||'<tr><td colspan="11">لا توجد عربيات</td></tr>'}
function img(file){return new Promise(r=>{if(!file)return r('');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};im.src=fr.result};fr.readAsDataURL(file)})}async function values(old={}){return{id:old.id||crypto.randomUUID(),parking:$('f0').value.trim(),plate:$('f1').value.trim(),owner:$('f2').value.trim(),chassis:$('f3').value.trim(),line:$('f4').value,phone:$('f5').value.trim(),card:$('f6').value.trim(),passengers:$('f7').value,license:$('f8').files[0]?await img($('f8').files[0]):(old.license||'')}}async function addCar(){data.cars.push(await values());save();render();toast('تم إضافة العربية')}async function editCar(id){const c=data.cars.find(x=>x.id===id);$('modal').innerHTML=`<div class="modalbox"><button class="close gray" onclick="closeM()">✕</button><h2>تعديل العربية</h2>${form(c)}<button class="blue" onclick="saveCar('${id}')">💾 حفظ</button></div>`;$('modal').classList.remove('hidden')}async function saveCar(id){const old=data.cars.find(x=>x.id===id),v=await values(old);Object.assign(old,v);save();closeM();render();toast('تم حفظ التعديلات')}function delCar(id){if(confirm('حذف العربية؟')){data.cars=data.cars.filter(c=>c.id!==id);save();render()}}function view(id){const c=data.cars.find(x=>x.id===id);$('modal').innerHTML=`<div class="modalbox"><button class="close gray" onclick="closeM()">✕</button><h2>صورة الرخصة</h2><img src="${c.license}" style="max-width:100%"></div>`;$('modal').classList.remove('hidden')}function closeM(){$('modal').classList.add('hidden')}
function exportExcel(){const wb=XLSX.utils.book_new();const cars=data.cars.map(c=>({'اسم الموقف':c.parking,'رقم السيارة':c.plate,'مالك السيارة':c.owner,'رقم الشاسيه':c.chassis,'خط السير':data.lines.find(l=>l.id===c.line)?.name||'','رقم التليفون':c.phone,'الكارتة المجمعة':c.card,'عدد الركاب':c.passengers,'صورة الرخصة':c.license?'مرفقة بالموقع':''}));const ls=data.lines.map(l=>({'اسم خط السير':l.name,'عدد العربيات':data.cars.filter(c=>c.line===l.id).length}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cars),'العربيات');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ls),'خطوط السير');XLSX.writeFile(wb,'parking.xlsx');toast('تم تصدير Excel')}function importExcel(){$('file').click()}function readExcel(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{try{const wb=XLSX.read(x.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],a=XLSX.utils.sheet_to_json(ws);const names=[...new Set(a.map(x=>String(x['خط السير']||'').trim()).filter(Boolean))];const map={};names.forEach(n=>{let l=data.lines.find(x=>x.name===n);if(!l){l={id:crypto.randomUUID(),name:n};data.lines.push(l)}map[n]=l.id});a.forEach(x=>data.cars.push({id:crypto.randomUUID(),parking:String(x['اسم الموقف']||''),plate:String(x['رقم السيارة']||''),owner:String(x['مالك السيارة']||''),chassis:String(x['رقم الشاسيه']||''),line:map[String(x['خط السير']||'').trim()]||'',phone:String(x['رقم التليفون']||''),card:String(x['الكارتة المجمعة']||''),passengers:String(x['عدد الركاب']||''),license:''}));save();render();toast('تم استيراد Excel بنجاح')}catch(err){toast('ملف Excel غير صالح')}e.target.value=''};r.readAsArrayBuffer(f)}
</script></body></html>
