<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام إدارة موقف العربيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef5ff,#f8fafc 55%,#e9efff)}.login-card{width:min(460px,100%);background:#fff;border-radius:28px;padding:34px;box-shadow:0 25px 80px #1e3a8a20;border:1px solid #e7edf5}.logo{width:78px;height:78px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;font-size:42px;background:#2563eb;color:#fff;box-shadow:0 12px 30px #2563eb35}.login h1{text-align:center;margin:0;font-size:26px}.sub{text-align:center;color:#718096;margin:8px 0 28px}.field{margin-bottom:16px}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid #d8e0ea;border-radius:13px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:#2563eb;box-shadow:0 0 0 4px #2563eb15}.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.primary:hover{background:#1d4ed8}.light{background:#eef2f7;color:#334155}.danger{background:#fee2e2;color:#b91c1c}.dark{background:#111827;color:#fff}.success{background:#dcfce7;color:#166534}.login-btn{width:100%;padding:14px;font-size:16px}.error{min-height:24px;text-align:center;color:#dc2626;font-weight:700;margin-top:10px}.hint{text-align:center;color:#94a3b8;font-size:12px;margin-top:10px}.sidebar{position:fixed;right:0;top:0;bottom:0;width:255px;background:#0f172a;color:#cbd5e1;padding:20px 15px;z-index:20;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;padding:8px 10px 25px}.brand-icon{width:42px;height:42px;border-radius:13px;background:#2563eb;display:grid;place-items:center;font-size:23px}.nav-title{font-size:11px;color:#64748b;padding:12px}.nav-btn{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:right;padding:12px 13px;border-radius:11px;cursor:pointer;margin:3px 0;font-weight:600}.nav-btn:hover,.nav-btn.active{background:#1e293b;color:#fff}.logout{margin-top:auto;border-top:1px solid #263247;padding-top:12px}.main{margin-right:255px;min-height:100vh}.top{height:76px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.top-title{font-weight:800;font-size:20px}.top-actions{display:flex;gap:8px}.content{padding:25px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.head h1{margin:0 0 4px;font-size:27px}.muted{color:#718096}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.stat,.card{background:#fff;border:1px solid #e6ebf2;border-radius:18px;box-shadow:0 10px 30px #0f172a09}.stat{padding:19px}.stat-label{color:#718096;font-size:13px}.stat-num{font-size:30px;font-weight:800;margin-top:7px}.card{padding:20px;margin-bottom:18px}.card h2{margin:0 0 15px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.search{width:min(430px,100%);padding:11px 14px;border:1px solid #d8e0ea;border-radius:12px;outline:0}.table-wrap{overflow:auto;border:1px solid #e8edf3;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:12px;border-bottom:1px solid #edf1f5;text-align:right}.table th{background:#f8fafc;color:#64748b;font-size:13px}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eff6ff;color:#1d4ed8}.modal{position:fixed;inset:0;background:#0f172a99;backdrop-filter:blur(5px);z-index:100;display:grid;place-items:center;padding:15px}.modal-box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0}.close{border:0;background:#eef2f7;border-radius:10px;width:38px;height:38px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.preview{max-width:100%;max-height:480px;border-radius:14px;display:block;margin:12px auto}.empty{text-align:center;padding:40px;color:#94a3b8}.toast{position:fixed;left:22px;bottom:22px;background:#111827;color:#fff;padding:12px 17px;border-radius:12px;z-index:200;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:1000px){.sidebar{width:78px}.brand span,.nav-title,.nav-btn span{display:none}.brand{justify-content:center}.nav-btn{text-align:center}.main{margin-right:78px}.cards{grid-template-columns:1fr 1fr}}@media(max-width:650px){.sidebar{right:0;left:0;top:auto;width:auto;height:64px;bottom:0;flex-direction:row;padding:6px}.brand,.nav-title,.logout{display:none}.nav{display:flex;flex:1;justify-content:space-around}.nav-btn{width:auto;margin:0;padding:7px 12px}.nav-btn span{display:block;font-size:10px}.main{margin-right:0;padding-bottom:64px}.top{height:62px;padding:0 14px}.top-title{font-size:16px}.top-actions .db-btn{display:none}.content{padding:13px}.head{flex-direction:column;align-items:stretch}.cards{gap:8px}.stat{padding:13px}.stat-num{font-size:23px}.grid{grid-template-columns:1fr}.login-card{padding:26px 18px}}
@media print{body{background:#fff}.sidebar,.top,.no-print{display:none!important}.main{margin:0}.content{padding:0}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<section id="login" class="login">
<div class="login-card">
<div class="logo">🚗</div>
<h1>نظام إدارة موقف العربيات</h1>
<div class="sub">إدارة خطوط السير والعربيات بطريقة بسيطة واحترافية</div>
<div class="field"><label>اسم المستخدم</label><input id="username" value="admin" autocomplete="username"></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div>
<button class="btn primary login-btn" id="loginBtn">دخول إلى النظام</button>
<div id="loginError" class="error"></div>
<div class="hint">admin / Admin@123</div>
</div>
</section>
<div id="app" class="hidden">
<aside class="sidebar">
<div class="brand"><div class="brand-icon">🚗</div><span>موقف العربيات</span></div>
<div class="nav-title">القائمة الرئيسية</div>
<div class="nav">
<button class="nav-btn active" id="nav-home">⌂ <span>الرئيسية</span></button>
<button class="nav-btn" id="nav-lines">↔ <span>خطوط السير</span></button>
<button class="nav-btn" id="nav-cars">🚘 <span>العربيات</span></button>
</div>
<div class="logout"><button class="nav-btn" id="logoutBtn">⇥ <span>تسجيل الخروج</span></button></div>
</aside>
<main class="main">
<header class="top"><div class="top-title" id="topTitle">لوحة التحكم</div><div class="top-actions"><button class="btn light db-btn no-print" id="dbBtn">💾 قاعدة البيانات</button><button class="btn dark no-print" id="printBtn">🖨️ طباعة</button></div></header>
<div class="content"><section id="page-home"></section><section id="page-lines" class="hidden"></section><section id="page-cars" class="hidden"></section></div>
</main>
</div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script>
let SQL=null,db=null,ready=false;
const DB_NAME='parking_manager_db_v2',STORE='sqlite',KEY='parking';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function openIDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function loadBytes(){const d=await openIDB();return new Promise((resolve,reject)=>{const q=d.transaction(STORE,'readonly').objectStore(STORE).get(KEY);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}
async function saveBytes(bytes){const d=await openIDB();return new Promise((resolve,reject)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).put(bytes,KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function persist(){if(db)await saveBytes(db.export())}
function query(sql){const r=db.exec(sql)[0];if(!r)return[];return r.values.map(v=>Object.fromEntries(r.columns.map((c,i)=>[c,v[i]])))}
function scalar(sql){const r=db.exec(sql)[0];return r?r.values[0][0]:0}
async function init(){try{SQL=await initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/'+f});const bytes=await loadBytes();if(bytes){db=new SQL.Database(new Uint8Array(bytes))}else{db=new SQL.Database();db.run('CREATE TABLE lines(id TEXT PRIMARY KEY,name TEXT UNIQUE NOT NULL);CREATE TABLE cars(id TEXT PRIMARY KEY,parking TEXT,plate TEXT,owner TEXT,chassis TEXT,line_id TEXT,phone TEXT,card TEXT,passengers TEXT,license_image TEXT,created_at TEXT DEFAULT CURRENT_TIMESTAMP,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);');await persist()}ready=true;$('loginError').textContent=''}catch(e){console.error(e);$('loginError').textContent='خطأ في تجهيز قاعدة البيانات. افتح الصفحة من جديد.'}}
function doLogin(){if(!ready){$('loginError').textContent='جاري تجهيز النظام...';return}if($('username').value.trim()==='admin'&&$('password').value==='Admin@123'){$('login').classList.add('hidden');$('app').classList.remove('hidden');renderAll()}else $('loginError').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}
$('loginBtn').onclick=doLogin;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('logoutBtn').onclick=()=>location.reload();
function showPage(p){['home','lines','cars'].forEach(x=>{$('page-'+x).classList.toggle('hidden',x!==p);$('nav-'+x).classList.toggle('active',x===p)});$('topTitle').textContent={home:'لوحة التحكم',lines:'خطوط السير',cars:'العربيات'}[p];renderAll()}
$('nav-home').onclick=()=>showPage('home');$('nav-lines').onclick=()=>showPage('lines');$('nav-cars').onclick=()=>showPage('cars');
function renderAll(){renderHome();renderLines();renderCars()}
function renderHome(){const lines=query('SELECT l.id,l.name,COUNT(c.id) count FROM lines l LEFT JOIN cars c ON c.line_id=l.id GROUP BY l.id ORDER BY l.name');const cars=scalar('SELECT COUNT(*) FROM cars');$('page-home').innerHTML='<div class="head"><div><h1>لوحة التحكم</h1><div class="muted">ملخص موقف العربيات وخطوط السير</div></div></div><div class="cards"><div class="stat"><div class="stat-label">خطوط السير</div><div class="stat-num">'+lines.length+'</div></div><div class="stat"><div class="stat-label">إجمالي العربيات</div><div class="stat-num">'+cars+'</div></div><div class="stat"><div class="stat-label">العربيات المربوطة بخط</div><div class="stat-num">'+scalar('SELECT COUNT(*) FROM cars WHERE line_id IS NOT NULL AND line_id <> ""')+'</div></div><div class="stat"><div class="stat-label">بدون خط</div><div class="stat-num">'+scalar('SELECT COUNT(*) FROM cars WHERE line_id IS NULL OR line_id = ""')+'</div></div></div><div class="card"><h2>عدد العربيات بكل خط</h2><div class="table-wrap"><table class="table"><thead><tr><th>خط السير</th><th>عدد العربيات</th></tr></thead><tbody>'+ (lines.length?lines.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td><span class="badge">'+x.count+' عربية</span></td></tr>').join(''):'<tr><td colspan="2" class="empty">لا توجد خطوط سير حتى الآن</td></tr>')+'</tbody></table></div></div>'}
function renderLines(){const lines=query('SELECT l.id,l.name,COUNT(c.id) count FROM lines l LEFT JOIN cars c ON c.line_id=l.id GROUP BY l.id ORDER BY l.name');$('page-lines').innerHTML='<div class="head"><div><h1>خطوط السير</h1><div class="muted">إضافة وتعديل وحذف خطوط السير</div></div><button class="btn primary" onclick="lineForm()">＋ إضافة خط</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>اسم الخط</th><th>عدد العربيات</th><th>الإجراءات</th></tr></thead><tbody>'+ (lines.length?lines.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td><span class="badge">'+x.count+'</span></td><td><div class="actions"><button class="btn light" onclick="lineForm(\''+x.id+'\')">✏️ تعديل</button><button class="btn danger" onclick="deleteLine(\''+x.id+'\')">🗑️ حذف</button></div></td></tr>').join(''):'<tr><td colspan="3" class="empty">لا توجد خطوط سير</td></tr>')+'</tbody></table></div></div>'}
function lineForm(id){const x=id?query('SELECT * FROM lines WHERE id="'+id.replaceAll('"','')+'"')[0]:null;openModal('<div class="modal-box"><div class="modal-head"><h2>'+(x?'تعديل خط السير':'إضافة خط سير')+'</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>اسم خط السير</label><input id="lineName" value="'+esc(x?.name||'')+'" placeholder="مثال: القاهرة - المصنع"></div><button class="btn primary" onclick="saveLine('+(x?"'"+x.id+"'":'null')+')">حفظ</button></div>')}
async function saveLine(id){const name=$('lineName').value.trim();if(!name){toast('اكتب اسم الخط');return}try{if(id)db.run('UPDATE lines SET name=? WHERE id=?',[name,id]);else db.run('INSERT INTO lines(id,name) VALUES(?,?)',[crypto.randomUUID(),name]);await persist();closeModal();renderAll();toast('تم الحفظ')}catch(e){toast('اسم الخط موجود بالفعل')}}
async function deleteLine(id){const n=scalar('SELECT COUNT(*) FROM cars WHERE line_id="'+id+'"');if(n){toast('لا يمكن حذف الخط لأنه عليه '+n+' عربية');return}if(!confirm('حذف خط السير؟'))return;db.run('DELETE FROM lines WHERE id=?',[id]);await persist();renderAll();toast('تم حذف الخط')}
function renderCars(){const lines=query('SELECT * FROM lines ORDER BY name');$('page-cars').innerHTML='<div class="head"><div><h1>العربيات</h1><div class="muted">كل البيانات اختيارية ويمكن تعديلها لاحقًا</div></div><button class="btn primary" onclick="carForm()">＋ إضافة عربية</button></div><div class="card"><div class="toolbar"><input class="search" id="carSearch" placeholder="🔎 ابحث برقم السيارة أو المالك أو الشاسيه أو الخط" oninput="filterCars(this.value)"><span class="muted">'+scalar('SELECT COUNT(*) FROM cars')+' عربية</span></div><div class="table-wrap"><table class="table"><thead><tr><th>رقم السيارة</th><th>المالك</th><th>الشاسيه</th><th>خط السير</th><th>التليفون</th><th>الرخصة</th><th>الإجراءات</th></tr></thead><tbody id="carsBody"></tbody></table></div></div>';fillCars('',lines)}
function fillCars(term,lines){const q='%'+term.replaceAll('%','')+'%';const cars=query('SELECT c.*,l.name line_name FROM cars c LEFT JOIN lines l ON l.id=c.line_id WHERE c.plate LIKE "'+q+'" OR c.owner LIKE "'+q+'" OR c.chassis LIKE "'+q+'" OR l.name LIKE "'+q+'" ORDER BY c.plate');$('carsBody').innerHTML=cars.length?cars.map(c=>'<tr><td><b>'+esc(c.plate||'-')+'</b></td><td>'+esc(c.owner||'-')+'</td><td>'+esc(c.chassis||'-')+'</td><td>'+esc(c.line_name||'غير محدد')+'</td><td>'+esc(c.phone||'-')+'</td><td>'+(c.license_image?'<button class="btn light" onclick="viewLicense(\''+c.id+'\')">👁️ عرض</button>':'<span class="muted">لا توجد</span>')+'</td><td><div class="actions"><button class="btn light" onclick="carForm(\''+c.id+'\')">✏️ تعديل</button><button class="btn danger" onclick="deleteCar(\''+c.id+'\')">🗑️ حذف</button></div></td></tr>').join(''):'<tr><td colspan="7" class="empty">لا توجد عربيات</td></tr>'}
function filterCars(v){fillCars(v,query('SELECT * FROM lines ORDER BY name'))}
function carForm(id){const c=id?query('SELECT * FROM cars WHERE id="'+id.replaceAll('"','')+'"')[0]:null;const lines=query('SELECT * FROM lines ORDER BY name');const sel=lines.map(l=>'<option value="'+esc(l.id)+'" '+(c?.line_id===l.id?'selected':'')+'>'+esc(l.name)+'</option>').join('');openModal('<div class="modal-box"><div class="modal-head"><h2>'+(c?'تعديل بيانات العربية':'إضافة عربية')+'</h2><button class="close" onclick="closeModal()">×</button></div><div class="grid"><div class="field"><label>رقم السيارة</label><input id="plate" value="'+esc(c?.plate||'')+'" placeholder="حروف وأرقام"></div><div class="field"><label>مالك السيارة</label><input id="owner" value="'+esc(c?.owner||'')+'"></div><div class="field"><label>رقم الشاسيه</label><input id="chassis" value="'+esc(c?.chassis||'')+'"></div><div class="field"><label>خط السير</label><select id="line"><option value="">غير محدد</option>'+sel+'</select></div><div class="field"><label>رقم التليفون</label><input id="phone" value="'+esc(c?.phone||'')+'"></div><div class="field"><label>الكارتة المجمعة</label><input id="card" value="'+esc(c?.card||'')+'"></div><div class="field"><label>عدد الركاب</label><input id="passengers" value="'+esc(c?.passengers||'')+'"></div><div class="field"><label>صورة رخصة العربية</label><input id="license" type="file" accept="image/*"><div class="muted">اختياري — ويمكن استبدال الصورة عند التعديل</div></div></div><button class="btn primary" onclick="saveCar('+(c?"'"+c.id+"'":'null')+')">حفظ العربية</button></div>')}
async function saveCar(id){const f=$('license').files[0];let image=null;if(f)image=await fileData(f);else if(id){const old=query('SELECT license_image FROM cars WHERE id=?',[id])[0];image=old?.license_image||null}const vals=[$('plate').value.trim(),$('owner').value.trim(),$('chassis').value.trim(),$('line').value,$('phone').value.trim(),$('card').value.trim(),$('passengers').value.trim(),image,new Date().toISOString()];if(id)db.run('UPDATE cars SET plate=?,owner=?,chassis=?,line_id=?,phone=?,card=?,passengers=?,license_image=?,updated_at=? WHERE id=?',[...vals,id]);else db.run('INSERT INTO cars(id,plate,owner,chassis,line_id,phone,card,passengers,license_image,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?)',[crypto.randomUUID(),...vals]);await persist();closeModal();renderAll();toast('تم حفظ العربية')}
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function deleteCar(id){if(!confirm('حذف العربية؟'))return;db.run('DELETE FROM cars WHERE id=?',[id]);await persist();renderAll();toast('تم حذف العربية')}
function viewLicense(id){const c=query('SELECT plate,license_image FROM cars WHERE id=?',[id])[0];if(!c?.license_image){toast('لا توجد صورة');return}openModal('<div class="modal-box"><div class="modal-head"><h2>رخصة السيارة '+esc(c.plate||'')+'</h2><button class="close" onclick="closeModal()">×</button></div><img class="preview" src="'+c.license_image+'"><div style="text-align:center"><button class="btn light" onclick="carForm(\''+id+'\')">✏️ تعديل / استبدال الصورة</button></div></div>')}
function openModal(html){$('modal').innerHTML=html;$('modal').classList.remove('hidden')};function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
$('dbBtn').onclick=()=>{const blob=new Blob([db.export()],{type:'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='parking.db';a.click();URL.revokeObjectURL(a.href)};
$('printBtn').onclick=()=>printCars();
function printCars(){const cars=query('SELECT c.*,l.name line_name FROM cars c LEFT JOIN lines l ON l.id=c.line_id ORDER BY l.name,c.plate');const w=window.open('','_blank');if(!w){toast('اسمح بفتح النوافذ المنبثقة للطباعة');return}let html='<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>بيانات موقف العربيات</title><style>body{font-family:Arial;padding:25px}h1{text-align:center}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:8px;text-align:right}th{background:#eee}</style></head><body><h1>بيانات موقف العربيات</h1><table><thead><tr><th>خط السير</th><th>رقم السيارة</th><th>المالك</th><th>الشاسيه</th><th>التليفون</th><th>عدد الركاب</th></tr></thead><tbody>';cars.forEach(c=>{html+='<tr><td>'+esc(c.line_name||'غير محدد')+'</td><td>'+esc(c.plate||'')+'</td><td>'+esc(c.owner||'')+'</td><td>'+esc(c.chassis||'')+'</td><td>'+esc(c.phone||'')+'</td><td>'+esc(c.passengers||'')+'</td></tr>'});html+='</tbody></table></body></html>';w.document.open();w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),400)}
init();
</script>
</body>
</html>
