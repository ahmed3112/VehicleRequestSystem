<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام إدارة موقف السيارات</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f3f6f9;color:#17202a}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef3f8,#fff)}.login-card{width:min(420px,100%);background:#fff;padding:32px;border-radius:18px;box-shadow:0 8px 30px #0002;text-align:right}.login-card h1{text-align:center;margin-top:0}.logo{text-align:center;font-size:48px}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:7px}input,select{width:100%;padding:12px;border:1px solid #ccd3da;border-radius:8px;font-size:15px}button,.btn{background:#1769aa;color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-size:15px}.login button{width:100%;margin-top:8px}.error{color:#c62828;margin-top:10px;text-align:center}.app.hidden{display:none}nav{background:#17202a;color:#fff;padding:16px 5%;display:flex;gap:22px;align-items:center;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;cursor:pointer}.logout{margin-right:auto;background:#c62828}.wrap{max-width:1400px;margin:24px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 12px #0001;margin-bottom:18px}.num{font-size:32px;font-weight:700;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.table-wrap{overflow:auto;background:#fff;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}th{background:#eef2f5}.alert{background:#fff3cd;padding:11px;border-radius:8px;margin-bottom:15px}.hidden{display:none}.danger{background:#c62828}.muted{color:#667085}.small{font-size:13px}
</style></head>
<body>
<section id="login" class="login"><div class="login-card"><div class="logo">🚗</div><h1>نظام إدارة موقف السيارات</h1><p style="text-align:center" class="muted">تسجيل الدخول</p><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><button onclick="login()">دخول</button><div id="loginError" class="error"></div><p class="small muted" style="text-align:center;margin-top:18px">حساب تجريبي: admin / Admin@123</p></div></section>
<div id="app" class="app hidden"><nav><strong>🚗 نظام إدارة موقف السيارات</strong><a onclick="show('dashboard')">الرئيسية</a><a onclick="show('lines')">الخطوط</a><a onclick="show('vehicles')">العربيات</a><button class="logout" onclick="logout()">تسجيل الخروج</button></nav><div class="wrap"><div id="msg"></div><section id="dashboard"></section><section id="lines" class="hidden"></section><section id="vehicles" class="hidden"></section></div></div>
<script>
const USER='admin',PASS='Admin@123',KEY='parking_management_v2';
let data=JSON.parse(localStorage.getItem(KEY)||'{"lines":[],"vehicles":[]}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=t=>{document.getElementById('msg').innerHTML='<div class="alert">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('msg').innerHTML='',2500)};
function login(){if(username.value===USER&&password.value===PASS){sessionStorage.setItem('parking_login','1');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');show('dashboard')}else document.getElementById('loginError').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}
function logout(){sessionStorage.removeItem('parking_login');location.reload()}
function show(id){['dashboard','lines','vehicles'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));render()}
function render(){renderDash();renderLines();renderVehicles()}
function renderDash(){let active=data.vehicles.filter(v=>v.status==='يعمل').length,maint=data.vehicles.filter(v=>v.status==='صيانة').length;document.getElementById('dashboard').innerHTML=`<h1>لوحة التحكم</h1><div class="cards"><div class="card">إجمالي الخطوط<div class="num">${data.lines.length}</div></div><div class="card">إجمالي العربيات<div class="num">${data.vehicles.length}</div></div><div class="card">العربيات العاملة<div class="num">${active}</div></div><div class="card">العربيات في الصيانة<div class="num">${maint}</div></div></div><h2>عدد العربيات لكل خط</h2><div class="table-wrap"><table><tr><th>كود الخط</th><th>اسم الخط</th><th>عدد العربيات</th></tr>${data.lines.map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(l.name)}</td><td><b>${data.vehicles.filter(v=>v.lineId===l.id).length}</b></td></tr>`).join('')||'<tr><td colspan="3">لا توجد خطوط</td></tr>'}</table></div>`}
function renderLines(){document.getElementById('lines').innerHTML=`<h1>إدارة خطوط السير</h1><form class="card" onsubmit="addLine(event)"><div class="grid"><div class="field"><label>كود الخط</label><input id="lineCode" required placeholder="مثال: 01"></div><div class="field"><label>اسم الخط</label><input id="lineName" required placeholder="مثال: المصنع - القاهرة"></div><div class="field"><label>وصف الخط</label><input id="lineDesc"></div></div><button>إضافة الخط</button></form><div class="table-wrap"><table><tr><th>الكود</th><th>اسم الخط</th><th>عدد العربيات</th><th>إجراء</th></tr>${data.lines.map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(l.name)}</td><td>${data.vehicles.filter(v=>v.lineId===l.id).length}</td><td><button class="danger" onclick="delLine('${l.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="4">لا توجد بيانات</td></tr>'}</table></div>`}
function addLine(e){e.preventDefault();let id=Date.now().toString();if(data.lines.some(l=>l.code===lineCode.value.trim()))return msg('كود الخط موجود بالفعل');data.lines.push({id,code:lineCode.value.trim(),name:lineName.value.trim(),desc:lineDesc.value.trim()});save();msg('تم إضافة الخط بنجاح');render()}
function delLine(id){if(!confirm('هل تريد حذف الخط؟'))return;data.lines=data.lines.filter(l=>l.id!==id);data.vehicles.forEach(v=>{if(v.lineId===id)v.lineId=''});save();render()}
function renderVehicles(){let q=document.getElementById('vsearch')?.value?.toLowerCase()||'';let rows=data.vehicles.filter(v=>Object.values(v).join(' ').toLowerCase().includes(q));let options='<option value="">بدون خط</option>'+data.lines.map(l=>`<option value="${l.id}">${esc(l.code)} - ${esc(l.name)}</option>`).join('');document.getElementById('vehicles').innerHTML=`<h1>إدارة العربيات</h1><div class="card"><div class="field"><label>بحث</label><input id="vsearch" oninput="renderVehicles()" value="${esc(q)}" placeholder="الموقف / رقم السيارة / المالك / الشاسيه / الموتور / التليفون / الخط"></div></div><form class="card" onsubmit="addVehicle(event)"><h3>بيانات العربية</h3><div class="grid"><div class="field"><label>اسم الموقف</label><input id="parkingName" required></div><div class="field"><label>رقم السيارة</label><input id="plateNumber" required></div><div class="field"><label>حروف السيارة</label><input id="plateLetters"></div><div class="field"><label>أرقام السيارة</label><input id="plateNumbers"></div><div class="field"><label>نوع السيارة</label><select id="vehicleType"><option>أتوبيس</option><option>ميكروباص</option><option>ملاكي</option><option>نقل</option><option>بيك أب</option><option>فان</option><option>أخرى</option></select></div><div class="field"><label>مالك السيارة</label><input id="ownerName"></div><div class="field"><label>رقم الشاسيه</label><input id="chassis"></div><div class="field"><label>رقم الموتور</label><input id="engine"></div><div class="field"><label>خط السير</label><select id="lineId">${options}</select></div><div class="field"><label>رقم التليفون</label><input id="phone" type="tel"></div><div class="field"><label>الكارتة المجمعة</label><input id="cardNo"></div><div class="field"><label>عدد الركاب</label><input id="passengers" type="number" min="0"></div><div class="field"><label>الماركة</label><input id="brand"></div><div class="field"><label>الموديل</label><input id="model"></div><div class="field"><label>سنة الصنع</label><input id="year" type="number"></div><div class="field"><label>الحالة</label><select id="status"><option>يعمل</option><option>صيانة</option><option>متوقف</option></select></div></div><button>إضافة العربية</button></form><h2>قائمة العربيات</h2><div class="table-wrap"><table><tr><th>الموقف</th><th>رقم السيارة</th><th>الحروف</th><th>الأرقام</th><th>النوع</th><th>المالك</th><th>الشاسيه</th><th>الموتور</th><th>خط السير</th><th>التليفون</th><th>الكارتة المجمعة</th><th>عدد الركاب</th><th>الحالة</th><th>إجراء</th></tr>${rows.map(v=>`<tr><td>${esc(v.parkingName)}</td><td><b>${esc(v.plateNumber)}</b></td><td>${esc(v.plateLetters)}</td><td>${esc(v.plateNumbers)}</td><td>${esc(v.vehicleType)}</td><td>${esc(v.ownerName)}</td><td>${esc(v.chassis)}</td><td>${esc(v.engine)}</td><td>${esc(data.lines.find(l=>l.id===v.lineId)?.name||'بدون خط')}</td><td>${esc(v.phone)}</td><td>${esc(v.cardNo)}</td><td>${esc(v.passengers)}</td><td>${esc(v.status)}</td><td><button class="danger" onclick="delVehicle('${v.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="14">لا توجد بيانات</td></tr>'}</table></div>`}
function addVehicle(e){e.preventDefault();if(data.vehicles.some(v=>v.plateNumber.trim()===plateNumber.value.trim()))return msg('رقم السيارة موجود بالفعل');data.vehicles.push({id:Date.now().toString(),parkingName:parkingName.value.trim(),plateNumber:plateNumber.value.trim(),plateLetters:plateLetters.value.trim(),plateNumbers:plateNumbers.value.trim(),vehicleType:vehicleType.value,ownerName:ownerName.value.trim(),chassis:chassis.value.trim(),engine:engine.value.trim(),lineId:lineId.value,phone:phone.value.trim(),cardNo:cardNo.value.trim(),passengers:passengers.value,brand:brand.value.trim(),model:model.value.trim(),year:year.value,status:status.value});save();msg('تم إضافة العربية بنجاح');render()}
function delVehicle(id){if(!confirm('هل تريد حذف العربية؟'))return;data.vehicles=data.vehicles.filter(v=>v.id!==id);save();render()}
if(sessionStorage.getItem('parking_login')==='1'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');show('dashboard')}
</script></body></html>
