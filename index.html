<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>نظام إدارة موقف العربيات</title><script src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.loginCard{width:min(430px,100%);background:#fff;border-radius:20px;padding:28px 22px;box-shadow:0 12px 40px #00000014}.logo{text-align:center;font-size:58px}.loginCard h1{text-align:center;font-size:25px;margin:12px 0}.sub{text-align:center;color:#64748b;margin-bottom:22px}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border:1px solid #d5dde8;border-radius:11px;background:#fff;outline:none}.primary{width:100%;padding:13px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.primary:disabled{opacity:.55}.error{text-align:center;color:#dc2626;font-weight:700;min-height:20px}.hint{text-align:center;color:#94a3b8;font-size:12px}.hidden{display:none!important}.top{background:#0f172a;color:#fff;position:sticky;top:0;z-index:5}.topin{max-width:1450px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:8px}.brand{font-weight:700;white-space:nowrap}.nav{display:flex;gap:5px;flex:1}.nav button{border:0;background:transparent;color:#cbd5e1;padding:10px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#1e293b;color:#fff}.wrap{max-width:1450px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 7px 25px #0000000d}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.blue{background:#2563eb;color:#fff}.gray{background:#e2e8f0;color:#172033}.red{background:#fee2e2;color:#b91c1c}.dark{background:#111827;color:#fff}.tablewrap{overflow:auto;border:1px solid #e5eaf0;border-radius:12px}.table{width:100%;min-width:900px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf1f5;text-align:right}.table th{background:#f8fafc}.actions{display:flex;gap:6px;flex-wrap:wrap}.search{width:100%;padding:13px;border:1px solid #d5dde8;border-radius:10px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:50}.modalBox{background:#fff;width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px}.license{max-width:100%;max-height:450px;border-radius:10px}@media(max-width:700px){.topin{overflow:auto}.nav{overflow:auto}.nav button{white-space:nowrap}.wrap{padding:12px}.grid{grid-template-columns:1fr}.head{align-items:stretch;flex-direction:column}}@media print{.top,.no-print{display:none!important}.wrap{padding:0}.card{box-shadow:none}}
</style></head><body><section id="login" class="login"><div class="loginCard"><div class="logo">🚗</div><h1>نظام إدارة موقف العربيات</h1><div class="sub">تسجيل الدخول إلى النظام</div><div class="field"><label>اسم المستخدم</label><input id="u" value="admin" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="p" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary" onclick="login()">دخول إلى النظام</button><div id="err" class="error"></div><div class="hint">admin / Admin@123</div></div></section><div id="app" class="hidden"><header class="top"><div class="topin"><div class="brand">🚗 موقف العربيات</div><nav class="nav"><button id="nh" onclick="page('home')">الرئيسية</button><button id="nl" onclick="page('lines')">خطوط السير</button><button id="nc" onclick="page('cars')">العربيات</button></nav><div class="actions"><button class="btn dark" onclick="printReport()">🖨️ طباعة</button><button class="btn red" onclick="logout()">خروج</button></div></div></header><main class="wrap"><section id="home"></section><section id="lines" class="hidden"></section><section id="cars" class="hidden"></section></main></div><div id="modal" class="modal hidden"></div><script>let db=null,ready=false;const $=id=>document.getElementById(id),ID=()=>crypto.randomUUID();function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem('parking_sqlite',JSON.stringify([...db.export()]))}function rows(q,a=[]){const r=db.exec(q,a)[0];return r?r.values.map(v=>Object.fromEntries(r.columns.map((c,i)=>[c,v[i]]))):[]}async function init(){try{const SQL=await initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/'+f});const s=localStorage.getItem('parking_sqlite');if(s){try{db=new SQL.Database(new Uint8Array(JSON.parse(s)))}catch(e){localStorage.removeItem('parking_sqlite')}}if(!db){db=new SQL.Database();db.run('CREATE TABLE lines(id TEXT PRIMARY KEY,name TEXT UNIQUE);CREATE TABLE cars(id TEXT PRIMARY KEY,parking TEXT,plate TEXT,owner TEXT,chassis TEXT,line TEXT,phone TEXT,card TEXT,passengers TEXT,license TEXT)')}ready=true;$('loginBtn').disabled=false}catch(e){$('err').textContent='تعذر تحميل قاعدة البيانات، حدّث الصفحة';$('loginBtn').disabled=true}}$('loginBtn').disabled=true;init();$('p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});function login(){if(!ready){$('err').textContent='جاري تحميل النظام...';return}if($('u').value.trim()==='admin'&&$('p').value==='Admin@123'){$('login').classList.add('hidden');$('app').classList.remove('hidden');page('home')}else $('err').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}function logout(){location.reload()}function page(x){['home','lines','cars'].forEach(y=>$(y).classList.toggle('hidden',x!==y));['nh','nl','nc'].forEach(y=>$(y).classList.remove('active'));({home:'nh',lines:'nl',cars:'nc'})[x]&&$(({home:'nh',lines:'nl',cars:'nc'})[x]).classList.add('active');render()}function render(){home();linePage();carPage()}function home(){const l=rows('select * from lines'),c=rows('select * from cars');$('home').innerHTML='<div class="head"><div><h1>لوحة التحكم</h1><p>إدارة موقف العربيات وخطوط السير</p></div><button class="btn dark no-print" onclick="printReport()">🖨️ طباعة</button></div><div class="grid"><div class="card"><b>خطوط السير</b><h2>'+l.length+'</h2></div><div class="card"><b>إجمالي العربيات</b><h2>'+c.length+'</h2></div></div><div class="card"><h2>عدد العربيات لكل خط</h2><div class="tablewrap"><table class="table"><tr><th>خط السير</th><th>عدد العربيات</th></tr>'+l.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+c.filter(v=>v.line===x.id).length+'</td></tr>').join('')+'</table></div></div>'}function linePage(){$('lines').innerHTML='<div class="head"><div><h1>خطوط السير</h1><p>إضافة وتعديل وحذف خطوط السير</p></div></div><div class="card no-print"><div class="field"><label>اسم خط السير</label><input id="ln" placeholder="مثال: المصنع - القاهرة"></div><button class="btn blue" onclick="addLine()">+ إضافة خط السير</button></div><div class="card"><div class="tablewrap"><table class="table"><tr><th>اسم الخط</th><th>عدد العربيات</th><th>إجراء</th></tr>'+rows('select * from lines order by name').map(l=>'<tr><td><b>'+esc(l.name)+'</b></td><td>'+rows('select count(*) n from cars where line=?',[l.id])[0].n+'</td><td><div class="actions"><button class="btn gray" onclick="editLine(\''+l.id+'\')">✏️ تعديل</button><button class="btn red" onclick="delLine(\''+l.id+'\')">🗑️ حذف</button></div></td></tr>').join('')+'</table></div></div>'}function addLine(){const n=$('ln').value.trim();if(!n)return;if(rows('select * from lines where name=?',[n]).length)return alert('خط السير موجود بالفعل');db.run('insert into lines values(?,?)',[ID(),n]);save();render()}function editLine(id){const l=rows('select * from lines where id=?',[id])[0],n=prompt('تعديل اسم خط السير',l.name);if(n&&n.trim()){db.run('update lines set name=? where id=?',[n.trim(),id]);save();render()}}function delLine(id){if(rows('select * from cars where line=?',[id]).length)return alert('لا يمكن حذف خط السير لأنه مرتبط بعربيات');if(confirm('هل تريد حذف خط السير؟')){db.run('delete from lines where id=?',[id]);save();render()}}function form(c={}){return '<div class="grid"><div class="field"><label>اسم الموقف</label><input id="fparking" value="'+esc(c.parking||'')+'"></div><div class="field"><label>رقم السيارة</label><input id="fplate" value="'+esc(c.plate||'')+'" placeholder="حروف وأرقام"></div><div class="field"><label>مالك السيارة</label><input id="fowner" value="'+esc(c.owner||'')+'"></div><div class="field"><label>رقم الشاسيه</label><input id="fchassis" value="'+esc(c.chassis||'')+'"></div><div class="field"><label>خط السير</label><select id="fline"><option value="">بدون خط سير</option>'+rows('select * from lines order by name').map(l=>'<option value="'+l.id+'" '+(c.line===l.id?'selected':'')+'>'+esc(l.name)+'</option>').join('')+'</select></div><div class="field"><label>رقم التليفون</label><input id="fphone" type="tel" value="'+esc(c.phone||'')+'"></div><div class="field"><label>الكارتة المجمعة</label><input id="fcard" value="'+esc(c.card||'')+'"></div><div class="field"><label>عدد الركاب</label><input id="fpass" type="number" min="0" value="'+esc(c.passengers||'')+'"></div><div class="field"><label>صورة رخصة العربية</label><input id="flic" type="file" accept="image/*"><small>اختياري</small></div></div>'}function image(f){return new Promise(r=>{if(!f)return r('');const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}function carPage(){$('cars').innerHTML='<div class="head"><div><h1>العربيات</h1><p>كل الخانات اختيارية</p></div><button class="btn dark no-print" onclick="printReport()">🖨️ طباعة</button></div><div class="card no-print"><h2>إضافة عربية</h2>'+form()+'<br><button class="btn blue" onclick="addCar()">+ إضافة العربية</button></div><div class="card"><input class="search" id="search" placeholder="بحث برقم السيارة أو المالك أو الشاسيه..." oninput="drawCars()"><br><br><div class="tablewrap"><table class="table"><thead><tr><th>رقم السيارة</th><th>الموقف</th><th>المالك</th><th>الشاسيه</th><th>خط السير</th><th>الرخصة</th><th>إجراء</th></tr></thead><tbody id="ct"></tbody></table></div></div>';drawCars()}function lineName(id){return rows('select name from lines where id=?',[id])[0]?.name||'بدون خط'}function drawCars(){const q=($('search')?.value||'').toLowerCase();const a=rows('select * from cars order by plate').filter(c=>(Object.values(c).join(' ')+' '+lineName(c.line)).toLowerCase().includes(q));$('ct').innerHTML=a.map(c=>'<tr><td><b>'+esc(c.plate||'-')+'</b></td><td>'+esc(c.parking||'-')+'</td><td>'+esc(c.owner||'-')+'</td><td>'+esc(c.chassis||'-')+'</td><td>'+esc(lineName(c.line))+'</td><td>'+(c.license?'<button class="btn gray" onclick="view(\''+c.id+'\')">📷 عرض</button>':'-')+'</td><td><div class="actions"><button class="btn gray" onclick="editCar(\''+c.id+'\')">✏️ تعديل</button><button class="btn red" onclick="delCar(\''+c.id+'\')">🗑️ حذف</button></div></td></tr>').join('')||'<tr><td colspan="7">لا توجد عربيات</td></tr>'}async function vals(old={}){return{id:old.id||ID(),parking:$('fparking').value.trim(),plate:$('fplate').value.trim(),owner:$('fowner').value.trim(),chassis:$('fchassis').value.trim(),line:$('fline').value,phone:$('fphone').value.trim(),card:$('fcard').value.trim(),passengers:$('fpass').value,license:await image($('flic').files[0])||old.license||''}}async function addCar(){const v=await vals();db.run('insert into cars values(?,?,?,?,?,?,?,?,?,?)',[v.id,v.parking,v.plate,v.owner,v.chassis,v.line,v.phone,v.card,v.passengers,v.license]);save();render()}async function editCar(id){const c=rows('select * from cars where id=?',[id])[0];$('modal').innerHTML='<div class="modalBox"><button class="btn gray" onclick="closeM()">✕</button><h2>تعديل بيانات العربية</h2>'+form(c)+'<button class="btn blue" onclick="saveCar(\''+id+'\')">💾 حفظ التعديلات</button></div>';$('modal').classList.remove('hidden')}async function saveCar(id){const old=rows('select * from cars where id=?',[id])[0],v=await vals(old);db.run('update cars set parking=?,plate=?,owner=?,chassis=?,line=?,phone=?,card=?,passengers=?,license=? where id=?',[v.parking,v.plate,v.owner,v.chassis,v.line,v.phone,v.card,v.passengers,v.license,id]);save();closeM();render()}function delCar(id){if(confirm('هل تريد حذف العربية؟')){db.run('delete from cars where id=?',[id]);save();render()}}function view(id){const c=rows('select license from cars where id=?',[id])[0];$('modal').innerHTML='<div class="modalBox"><button class="btn gray" onclick="closeM()">✕</button><h2>صورة رخصة العربية</h2><img class="license" src="'+c.license+'"></div>';$('modal').classList.remove('hidden')}function closeM(){$('modal').classList.add('hidden')}function printReport(){const c=rows('select * from cars'),w=window.open('','_blank');if(!w)return alert('اسمح بفتح نافذة الطباعة من المتصفح');w.document.write('<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>كشف موقف العربيات</title><style>body{font-family:Arial}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:8px;text-align:right}</style></head><body><h1>كشف موقف العربيات</h1><table><tr><th>رقم السيارة</th><th>اسم الموقف</th><th>مالك السيارة</th><th>رقم الشاسيه</th><th>خط السير</th></tr>'+c.map(x=>'<tr><td>'+esc(x.plate)+'</td><td>'+esc(x.parking)+'</td><td>'+esc(x.owner)+'</td><td>'+esc(x.chassis)+'</td><td>'+esc(lineName(x.line))+'</td></tr>').join('')+'</table><script>window.onload=function(){window.print()}<\\/script></body></html>');w.document.close()}</script></body></html>
