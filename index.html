<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام موقف العربيات</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f9;color:#17202a}nav{background:#17202a;color:#fff;padding:16px 5%;display:flex;gap:22px;align-items:center;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;cursor:pointer}.wrap{max-width:1400px;margin:24px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 12px #0001;margin-bottom:18px}.num{font-size:32px;font-weight:700;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field{margin-bottom:12px}.field label{display:block;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #ccd3da;border-radius:8px}button,.btn{background:#1769aa;color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;text-decoration:none}.danger{background:#c62828}.muted{color:#667085}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}.table-wrap{overflow:auto;background:#fff;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}th{background:#eef2f5}.alert{background:#fff3cd;padding:11px;border-radius:8px;margin-bottom:15px}.hidden{display:none}.actions{display:flex;gap:6px}.small{font-size:13px}
</style></head>
<body>
<nav><strong>🚗 نظام موقف العربيات</strong><a onclick="show('dashboard')">الرئيسية</a><a onclick="show('lines')">الخطوط</a><a onclick="show('vehicles')">العربيات</a></nav>
<div class="wrap"><div id="msg"></div><section id="dashboard"></section><section id="lines" class="hidden"></section><section id="vehicles" class="hidden"></section></div>
<script>
const KEY='parking_management_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"lines":[],"vehicles":[]}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=t=>{document.getElementById('msg').innerHTML='<div class="alert">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('msg').innerHTML='',2500)};
function show(id){['dashboard','lines','vehicles'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));render();}
function render(){renderDash();renderLines();renderVehicles();}
function renderDash(){let active=data.vehicles.filter(v=>v.status==='Active').length,maint=data.vehicles.filter(v=>v.status==='Maintenance').length;document.getElementById('dashboard').innerHTML=`<h1>Dashboard</h1><div class="cards"><div class="card">إجمالي الخطوط<div class="num">${data.lines.length}</div></div><div class="card">إجمالي العربيات<div class="num">${data.vehicles.length}</div></div><div class="card">العربيات العاملة<div class="num">${active}</div></div><div class="card">العربيات في الصيانة<div class="num">${maint}</div></div></div><h2>عدد العربيات لكل خط</h2><div class="table-wrap"><table><tr><th>الكود</th><th>اسم الخط</th><th>عدد العربيات</th></tr>${data.lines.map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(l.name)}</td><td><b>${data.vehicles.filter(v=>v.lineId===l.id).length}</b></td></tr>`).join('')||'<tr><td colspan="3">لا توجد خطوط</td></tr>'}</table></div>`}
function renderLines(){document.getElementById('lines').innerHTML=`<h1>الخطوط</h1><form class="card" onsubmit="addLine(event)"><div class="grid"><div class="field"><label>كود الخط</label><input id="lineCode" required placeholder="L-01"></div><div class="field"><label>اسم الخط</label><input id="lineName" required></div><div class="field"><label>الوصف</label><input id="lineDesc"></div></div><button>إضافة الخط</button></form><div class="table-wrap"><table><tr><th>الكود</th><th>اسم الخط</th><th>عدد العربيات</th><th>إجراء</th></tr>${data.lines.map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(l.name)}</td><td>${data.vehicles.filter(v=>v.lineId===l.id).length}</td><td><button class="danger" onclick="delLine('${l.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="4">لا توجد بيانات</td></tr>'}</table></div>`}
function addLine(e){e.preventDefault();let id=Date.now().toString();data.lines.push({id,code:lineCode.value.trim(),name:lineName.value.trim(),desc:lineDesc.value.trim()});save();msg('تم إضافة الخط');render();}
function delLine(id){if(!confirm('حذف الخط؟'))return;data.lines=data.lines.filter(l=>l.id!==id);data.vehicles.forEach(v=>{if(v.lineId===id)v.lineId=''});save();render();}
function renderVehicles(){let q=document.getElementById('vsearch')?.value?.toLowerCase()||'';let rows=data.vehicles.filter(v=>Object.values(v).join(' ').toLowerCase().includes(q));let options='<option value="">-- بدون خط --</option>'+data.lines.map(l=>`<option value="${l.id}">${esc(l.code)} - ${esc(l.name)}</option>`).join('');document.getElementById('vehicles').innerHTML=`<h1>العربيات</h1><div class="card"><input id="vsearch" oninput="renderVehicles()" value="${esc(q)}" placeholder="بحث: الموقف / رقم السيارة / المالك / الشاسيه / الموتور / التليفون / الخط"></div><form class="card" onsubmit="addVehicle(event)"><h3>بيانات العربية</h3><div class="grid"><div class="field"><label>اسم الموقف</label><input id="parkingName" required></div><div class="field"><label>رقم السيارة</label><input id="plateNumber" required></div><div class="field"><label>حروف وأرقام</label><input id="plateLetters" placeholder="الحروف"><input id="plateNumbers" style="margin-top:6px" placeholder="الأرقام"></div><div class="field"><label>نوع السيارة</label><select id="vehicleType"><option>Bus</option><option>Microbus</option><option>Pickup</option><option>Truck</option><option>Van</option><option>Sedan</option><option>Other</option></select></div><div class="field"><label>مالك السيارة</label><input id="ownerName"></div><div class="field"><label>رقم الشاسيه</label><input id="chassis"></div><div class="field"><label>رقم الموتور</label><input id="engine"></div><div class="field"><label>خط السير</label><select id="lineId">${options}</select></div><div class="field"><label>رقم التليفون</label><input id="phone" type="tel"></div><div class="field"><label>الكارتة المجمعة</label><input id="cardNo"></div><div class="field"><label>عدد الركاب</label><input id="passengers" type="number" min="0"></div><div class="field"><label>الماركة</label><input id="brand"></div><div class="field"><label>الموديل</label><input id="model"></div><div class="field"><label>سنة الصنع</label><input id="year" type="number"></div><div class="field"><label>الحالة</label><select id="status"><option>Active</option><option>Maintenance</option><option>Inactive</option></select></div></div><button>إضافة العربية</button></form><h2>قائمة العربيات</h2><div class="table-wrap"><table><tr><th>الموقف</th><th>رقم السيارة</th><th>الحروف والأرقام</th><th>النوع</th><th>المالك</th><th>الشاسيه</th><th>الموتور</th><th>خط السير</th><th>التليفون</th><th>الكارتة</th><th>الركاب</th><th>الحالة</th><th>إجراء</th></tr>${rows.map(v=>`<tr><td>${esc(v.parkingName)}</td><td><b>${esc(v.plateNumber)}</b></td><td>${esc(v.plateLetters)} / ${esc(v.plateNumbers)}</td><td>${esc(v.vehicleType)}</td><td>${esc(v.ownerName)}</td><td>${esc(v.chassis)}</td><td>${esc(v.engine)}</td><td>${esc(data.lines.find(l=>l.id===v.lineId)?.name||'-')}</td><td>${esc(v.phone)}</td><td>${esc(v.cardNo)}</td><td>${esc(v.passengers)}</td><td>${esc(v.status)}</td><td><button class="danger" onclick="delVehicle('${v.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="13">لا توجد بيانات</td></tr>'}</table></div>`}
function addVehicle(e){e.preventDefault();data.vehicles.push({id:Date.now().toString(),parkingName:parkingName.value,plateNumber:plateNumber.value,plateLetters:plateLetters.value,plateNumbers:plateNumbers.value,vehicleType:vehicleType.value,ownerName:ownerName.value,chassis:chassis.value,engine:engine.value,lineId:lineId.value,phone:phone.value,cardNo:cardNo.value,passengers:passengers.value,brand:brand.value,model:model.value,year:year.value,status:status.value});save();msg('تم إضافة العربية');renderVehicles();}
function delVehicle(id){if(!confirm('حذف العربية؟'))return;data.vehicles=data.vehicles.filter(v=>v.id!==id);save();render();}
show('dashboard');
</script></body></html>
