<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>موقف العربيات | إدارة الأسطول</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#172033;--muted:#718096;--line:#e6ebf2;--primary:#2563eb;--primary2:#1d4ed8;--danger:#dc2626;--success:#059669;--shadow:0 12px 35px rgba(15,23,42,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif}button,input,select{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#dbeafe 0,#f5f7fb 45%,#eef2ff 100%)}
.login-card{width:min(450px,100%);background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.8);border-radius:28px;padding:34px;box-shadow:0 30px 80px rgba(30,64,175,.15)}
.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,#2563eb,#0f3cbd);display:grid;place-items:center;font-size:40px;margin:0 auto 18px;box-shadow:0 12px 30px #2563eb33}.login-card h1{text-align:center;margin:0;font-size:25px}.login-card .sub{text-align:center;color:var(--muted);margin:8px 0 26px}
.field{margin:0 0 15px}.field label{display:block;font-weight:700;margin:0 0 7px}.field input,.field select{width:100%;border:1px solid #d8e0ea;background:#fff;border-radius:13px;padding:12px 14px;outline:0;transition:.2s}.field input:focus,.field select:focus{border-color:#7aa2f7;box-shadow:0 0 0 4px #2563eb14}
.btn{border:0;border-radius:12px;padding:10px 15px;cursor:pointer;font-weight:700;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary2)}.btn-light{background:#eef2f7;color:#334155}.btn-danger{background:#fee2e2;color:#b91c1c}.btn-success{background:#dcfce7;color:#166534}.btn-dark{background:#111827;color:#fff}.login-btn{width:100%;padding:13px;font-size:16px}.hint{text-align:center;color:#94a3b8;font-size:12px;margin-top:15px}.error{text-align:center;color:var(--danger);font-weight:700;min-height:22px;margin-top:10px}
.app{min-height:100vh}.sidebar{position:fixed;right:0;top:0;bottom:0;width:255px;background:#0f172a;color:#cbd5e1;padding:22px 16px;z-index:20;display:flex;flex-direction:column}.side-brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;padding:8px 10px 25px}.side-logo{width:42px;height:42px;border-radius:13px;background:#2563eb;display:grid;place-items:center;font-size:23px}.nav-title{font-size:11px;color:#64748b;padding:14px 12px 7px}.nav-btn{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:right;padding:12px 13px;border-radius:11px;cursor:pointer;margin:3px 0;font-weight:600}.nav-btn:hover,.nav-btn.active{background:#1e293b;color:#fff}.side-bottom{margin-top:auto;border-top:1px solid #243044;padding-top:14px}.main{margin-right:255px;min-height:100vh}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}.top-title{font-weight:800;font-size:20px}.top-actions{display:flex;gap:8px;align-items:center}.content{padding:28px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.page-head h1{margin:0 0 4px;font-size:27px}.page-head p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#eff6ff;color:#2563eb;font-size:20px}.stat-num{font-size:30px;font-weight:800;margin-top:10px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}.card h2,.card h3{margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}.search{width:min(430px,100%);border:1px solid #d8e0ea;border-radius:12px;padding:11px 14px;background:#fff;outline:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:980px}.table th,.table td{padding:13px 12px;border-bottom:1px solid #edf1f5;text-align:right;vertical-align:middle}.table th{background:#f8fafc;color:#64748b;font-size:13px}.table tr:last-child td{border-bottom:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.badge-blue{background:#eff6ff;color:#1d4ed8}.badge-green{background:#ecfdf5;color:#047857}.badge-gray{background:#f1f5f9;color:#475569}.empty{text-align:center;padding:45px;color:#94a3b8}.modal{position:fixed;inset:0;background:#0f172a99;backdrop-filter:blur(5px);z-index:100;display:grid;place-items:center;padding:15px}.modal-box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 30px 80px #0003}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-head h2{margin:0}.close{border:0;background:#eef2f7;border-radius:10px;width:38px;height:38px;cursor:pointer}.preview{max-width:100%;max-height:500px;border-radius:14px;display:block;margin:auto}.upload-note{color:var(--muted);font-size:12px}.print-area{display:none}.toast{position:fixed;left:25px;bottom:25px;background:#111827;color:#fff;padding:12px 17px;border-radius:12px;box-shadow:0 12px 30px #0003;z-index:200;opacity:0;transform:translateY(12px);transition:.25s}.toast.show{opacity:1;transform:none}
@media(max-width:1000px){.sidebar{width:78px;padding:18px 10px}.side-brand span,.nav-title,.nav-btn span,.side-bottom .nav-btn span{display:none}.side-brand{justify-content:center}.nav-btn{text-align:center}.main{margin-right:78px}.cards{grid-template-columns:repeat(2,1fr)}.topbar{padding:0 18px}.content{padding:18px}}
@media(max-width:650px){.sidebar{position:fixed;right:0;left:0;top:auto;width:auto;height:65px;bottom:0;display:flex;flex-direction:row;padding:7px;justify-content:space-around}.side-brand,.nav-title,.side-bottom{display:none}.nav{display:flex;flex:1;justify-content:space-around}.nav-btn{margin:0;width:auto;padding:8px 12px}.nav-btn span{display:block;font-size:10px;margin-top:1px}.main{margin-right:0;padding-bottom:65px}.topbar{height:64px}.top-title{font-size:16px}.content{padding:13px}.page-head{align-items:stretch;flex-direction:column}.page-head h1{font-size:23px}.cards{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px}.stat-num{font-size:24px}.grid{grid-template-columns:1fr}.login-card{padding:25px 18px}}
@media print{body{background:#fff}.sidebar,.topbar,.no-print{display:none!important}.main{margin:0}.content{padding:0}.card{box-shadow:none;border:0}}
</style></head><body>
<section id="login" class="login"><div class="login-card"><div class="logo">🚗</div><h1>نظام إدارة موقف العربيات</h1><div class="sub">إدارة خطوط السير والعربيات بطريقة بسيطة واحترافية</div><div class="field"><label>اسم المستخدم</label><input id="username" value="admin" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn btn-primary login-btn" onclick="login()">دخول إلى النظام</button><div id="loginError" class="error"></div><div class="hint">admin / Admin@123</div></div></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="side-brand"><div class="side-logo">🚗</div><span>موقف العربيات</span></div><div class="nav-title">القائمة الرئيسية</div><div class="nav"><button class="nav-btn active" id="nav-home" onclick="showPage('home')">⌂ <span>الرئيسية</span></button><button class="nav-btn" id="nav-lines" onclick="showPage('lines')">↔ <span>خطوط السير</span></button><button class="nav-btn" id="nav-cars" onclick="showPage('cars')">🚘 <span>العربيات</span></button></div><div class="side-bottom"><button class="nav-btn" onclick="logout()">⇥ <span>تسجيل الخروج</span></button></div></aside><main class="main"><header class="topbar"><div class="top-title" id="topTitle">لوحة التحكم</div><div class="top-actions"><button class="btn btn-light no-print" onclick="openBackup()">💾 قاعدة البيانات</button><button class="btn btn-dark no-print" onclick="openPrint()">🖨️ طباعة</button></div></header><div class="content"><section id="page-home"></section><section id="page-lines" class="hidden"></section><section id="page-cars" class="hidden"></section></div></main></div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script>
let SQL,db,dbReady=false;const DB_NAME='parking_manager_db',DB_STORE='files',DB_KEY='sqlite';const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function getDbFile(){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(DB_KEY);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function putDbFile(bytes){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(bytes,DB_KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function saveDb(){if(db)await putDbFile(db.export())}
function rows(q,p=[]){const r=db.exec(q,p)[0];return r?r.values.map(v=>Object.fromEntries(r.columns.map((c,i)=>[c,v[i]]))):[]}
async function init(){try{SQL=await initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/'+f});const bytes=await getDbFile();db=bytes?new SQL.Database(new Uint8Array(bytes)):new SQL.Database();if(!bytes)db.run(`CREATE TABLE lines(id TEXT PRIMARY KEY,name TEXT UNIQUE);CREATE TABLE cars(id TEXT PRIMARY KEY,parking TEXT,plate TEXT,owner TEXT,chassis TEXT,line_id TEXT,phone TEXT,card TEXT,passengers TEXT,license_image TEXT,created_at TEXT DEFAULT CURRENT_TIMESTAMP,updated_at TEXT DEFAULT CURRENT_TIMESTAMP);`);dbReady=true}catch(e){console.error(e);$('loginError').textContent='تعذر تجهيز قاعدة البيانات. أعد تحميل الصفحة.'}}init();$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
function login(){if(!dbReady){$('loginError').textContent='جاري تجهيز قاعدة البيانات...';return}if($('username').value.trim()==='admin'&&$('password').value==='Admin@123'){$('login').classList.add('hidden');$('app').classList.remove('hidden');renderAll()}else $('loginError').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}function logout(){location.reload()}
function showPage(p){['home','lines','cars'].forEach(x=>$('page-'+x).classList.toggle('hidden',x!==p));['home','lines','cars'].forEach(x=>$('nav-'+x).classList.toggle('active',x===p));$('topTitle').textContent={home:'لوحة التحكم',lines:'خطوط السير',cars:'العربيات'}[p];renderAll()}
function renderAll(){dashboard();renderLines();renderCars()}
function dashboard(){const l=rows('SELECT * FROM lines ORDER BY name'),c=rows('SELECT * FROM cars ORDER BY plate'),assigned=c.filter(x=>x.line_id),unassigned=c.length-assigned.length;$('page-home').innerHTML=`<div class="page-head"><div><h1>لوحة التحكم</h1><p>نظرة سريعة على الموقف وخطوط السير والعربيات</p></div><div class="top-actions no-print"><button class="btn btn-primary" onclick="showPage('cars')">+ إضافة عربية</button><button class="btn btn-light" onclick="showPage('lines')">+ إضافة خط</button></div></div><div class="cards"><div class="stat"><div class="stat-top"><span>خطوط السير</span><span class="stat-icon">↔</span></div><div class="stat-num">${l.length}</div></div><div class="stat"><div class="stat-top"><span>إجمالي العربيات</span><span class="stat-icon">🚘</span></div><div class="stat-num">${c.length}</div></div><div class="stat"><div class="stat-top"><span>مرتبطة بخط</span><span class="stat-icon">✓</span></div><div class="stat-num">${assigned.length}</div></div><div class="stat"><div class="stat-top"><span>بدون خط</span><span class="stat-icon">○</span></div><div class="stat-num">${unassigned}</div></div></div><div class="card"><div class="toolbar"><div><h2>توزيع العربيات على الخطوط</h2><div style="color:var(--muted);font-size:13px">عدد العربيات في كل خط</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>خط السير</th><th>عدد العربيات</th><th>الحالة</th></tr></thead><tbody>${l.map(x=>{const n=c.filter(v=>v.line_id===x.id).length;return `<tr><td><b>${esc(x.name)}</b></td><td><span class="badge badge-blue">${n} عربية</span></td><td><span class="badge badge-green">نشط</span></td></tr>`}).join('')||`<tr><td colspan="3" class="empty">لا توجد خطوط سير حتى الآن</td></tr>`}</tbody></table></div></div>`}
function renderLines(){const l=rows('SELECT * FROM lines ORDER BY name');$('page-lines').innerHTML=`<div class="page-head"><div><h1>خطوط السير</h1><p>أضف الخطوط وعدّل أسماءها واحذف الخط غير المرتبط بعربيات</p></div></div><div class="card no-print"><h3>إضافة خط سير</h3><div class="grid"><div class="field"><label>اسم خط السير</label><input id="lineName" placeholder="مثال: المصنع - القاهرة"></div><div style="display:flex;align-items:end"><button class="btn btn-primary" style="width:100%" onclick="addLine()">+ إضافة الخط</button></div></div></div><div class="card"><div class="toolbar"><h2>قائمة الخطوط</h2><span class="badge badge-gray">${l.length} خط</span></div><div class="table-wrap"><table class="table"><thead><tr><th>اسم الخط</th><th>عدد العربيات</th><th>إجراءات</th></tr></thead><tbody>${l.map(x=>{const n=rows('SELECT COUNT(*) n FROM cars WHERE line_id=?',[x.id])[0].n;return `<tr><td><b>${esc(x.name)}</b></td><td>${n}</td><td><div class="actions"><button class="btn btn-light" onclick="editLine('${x.id}')">✏️ تعديل</button><button class="btn btn-danger" onclick="deleteLine('${x.id}')">🗑️ حذف</button></div></td></tr>`}).join('')||`<tr><td colspan="3" class="empty">لا توجد خطوط</td></tr>`}</tbody></table></div></div>`}
function addLine(){const n=$('lineName').value.trim();if(!n)return toast('اكتب اسم خط السير أولاً');if(rows('SELECT id FROM lines WHERE name=?',[n]).length)return toast('اسم الخط موجود بالفعل');db.run('INSERT INTO lines(id,name) VALUES(?,?)',[uid(),n]);saveDb();renderAll();toast('تم إضافة خط السير')}
function editLine(id){const x=rows('SELECT * FROM lines WHERE id=?',[id])[0],n=prompt('تعديل اسم خط السير',x.name);if(n&&n.trim()&&n.trim()!==x.name){if(rows('SELECT id FROM lines WHERE name=? AND id<>?',[n.trim(),id]).length)return toast('اسم الخط موجود بالفعل');db.run('UPDATE lines SET name=? WHERE id=?',[n.trim(),id]);saveDb();renderAll();toast('تم تعديل اسم الخط')}}
function deleteLine(id){const n=rows('SELECT COUNT(*) n FROM cars WHERE line_id=?',[id])[0].n;if(Number(n)>0)return toast('لا يمكن حذف الخط لأنه مرتبط بعربيات');if(confirm('حذف خط السير؟')){db.run('DELETE FROM lines WHERE id=?',[id]);saveDb();renderAll();toast('تم حذف الخط')}}
function carForm(c={}){const lines=rows('SELECT * FROM lines ORDER BY name');return `<div class="grid"><div class="field"><label>اسم الموقف</label><input id="fparking" value="${esc(c.parking||'')}"></div><div class="field"><label>رقم السيارة</label><input id="fplate" value="${esc(c.plate||'')}" placeholder="حروف وأرقام"></div><div class="field"><label>مالك السيارة</label><input id="fowner" value="${esc(c.owner||'')}"></div><div class="field"><label>رقم الشاسيه</label><input id="fchassis" value="${esc(c.chassis||'')}"></div><div class="field"><label>خط السير</label><select id="fline"><option value="">بدون خط سير</option>${lines.map(l=>`<option value="${l.id}" ${c.line_id===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>رقم التليفون</label><input id="fphone" type="tel" value="${esc(c.phone||'')}"></div><div class="field"><label>الكارتة المجمعة</label><input id="fcard" value="${esc(c.card||'')}"></div><div class="field"><label>عدد الركاب</label><input id="fpass" type="number" min="0" value="${esc(c.passengers||'')}"></div><div class="field" style="grid-column:1/-1"><label>صورة رخصة العربية</label><input id="flic" type="file" accept="image/*"><div class="upload-note">اختياري — عند التعديل، رفع صورة جديدة يستبدل الصورة القديمة.</div></div></div>`}
function renderCars(){const c=rows('SELECT * FROM cars ORDER BY plate');$('page-cars').innerHTML=`<div class="page-head"><div><h1>العربيات</h1><p>كل البيانات اختيارية ويمكن تعديلها أو حذفها في أي وقت</p></div></div><div class="card no-print"><h3>إضافة عربية</h3>${carForm()}<div style="margin-top:8px"><button class="btn btn-primary" onclick="addCar()">+ إضافة العربية</button></div></div><div class="card"><div class="toolbar"><input id="carSearch" class="search" placeholder="🔎 بحث برقم السيارة أو المالك أو الشاسيه أو الخط..." oninput="drawCars()"><span class="badge badge-gray">${c.length} عربية</span></div><div class="table-wrap"><table class="table"><thead><tr><th>رقم السيارة</th><th>الموقف</th><th>المالك</th><th>الشاسيه</th><th>خط السير</th><th>الرخصة</th><th>إجراءات</th></tr></thead><tbody id="carRows"></tbody></table></div></div>`;drawCars()}
function lineName(id){return id?((rows('SELECT name FROM lines WHERE id=?',[id])[0]||{}).name||''):'بدون خط'}
function drawCars(){const q=($('carSearch')?.value||'').trim().toLowerCase();const a=rows('SELECT * FROM cars ORDER BY plate').filter(c=>(Object.values(c).join(' ')+' '+lineName(c.line_id)).toLowerCase().includes(q));$('carRows').innerHTML=a.map(c=>`<tr><td><b>${esc(c.plate||'-')}</b></td><td>${esc(c.parking||'-')}</td><td>${esc(c.owner||'-')}</td><td>${esc(c.chassis||'-')}</td><td>${c.line_id?`<span class="badge badge-blue">${esc(lineName(c.line_id))}</span>`:'<span class="badge badge-gray">بدون خط</span>'}</td><td>${c.license_image?`<button class="btn btn-light" onclick="viewLicense('${c.id}')">👁️ عرض</button>`:'-'}</td><td><div class="actions"><button class="btn btn-light" onclick="editCar('${c.id}')">✏️ تعديل</button><button class="btn btn-danger" onclick="deleteCar('${c.id}')">🗑️ حذف</button></div></td></tr>`).join('')||`<tr><td colspan="7" class="empty">لا توجد عربيات مطابقة للبحث</td></tr>`}
function readImage(file){return new Promise(resolve=>{if(!file)return resolve('');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const max=1400,s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*s));cv.height=Math.max(1,Math.round(im.height*s));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(file)})}
async function formValues(old={}){return{parking:$('fparking').value.trim(),plate:$('fplate').value.trim(),owner:$('fowner').value.trim(),chassis:$('fchassis').value.trim(),line_id:$('fline').value,phone:$('fphone').value.trim(),card:$('fcard').value.trim(),passengers:$('fpass').value,license_image:await readImage($('flic').files[0])||old.license_image||''}}
async function addCar(){const v=await formValues();db.run('INSERT INTO cars(id,parking,plate,owner,chassis,line_id,phone,card,passengers,license_image) VALUES(?,?,?,?,?,?,?,?,?,?)',[uid(),v.parking,v.plate,v.owner,v.chassis,v.line_id||null,v.phone,v.card,v.passengers,v.license_image]);await saveDb();renderAll();toast('تم إضافة العربية')}
function editCar(id){const c=rows('SELECT * FROM cars WHERE id=?',[id])[0];$('modal').innerHTML=`<div class="modal-box"><div class="modal-head"><h2>تعديل بيانات العربية</h2><button class="close" onclick="closeModal()">✕</button></div>${carForm(c)}<div style="display:flex;gap:8px;margin-top:5px"><button class="btn btn-primary" onclick="saveCar('${id}')">💾 حفظ التعديلات</button><button class="btn btn-light" onclick="closeModal()">إلغاء</button></div></div>`;$('modal').classList.remove('hidden')}
async function saveCar(id){const old=rows('SELECT * FROM cars WHERE id=?',[id])[0],v=await formValues(old);db.run('UPDATE cars SET parking=?,plate=?,owner=?,chassis=?,line_id=?,phone=?,card=?,passengers=?,license_image=?,updated_at=CURRENT_TIMESTAMP WHERE id=?',[v.parking,v.plate,v.owner,v.chassis,v.line_id||null,v.phone,v.card,v.passengers,v.license_image,id]);await saveDb();closeModal();renderAll();toast('تم حفظ التعديلات')}
function deleteCar(id){if(confirm('هل تريد حذف العربية نهائياً؟')){db.run('DELETE FROM cars WHERE id=?',[id]);saveDb();renderAll();toast('تم حذف العربية')}}function viewLicense(id){const c=rows('SELECT plate,license_image FROM cars WHERE id=?',[id])[0];$('modal').innerHTML=`<div class="modal-box"><div class="modal-head"><h2>رخصة العربية ${esc(c.plate||'')}</h2><button class="close" onclick="closeModal()">✕</button></div><img class="preview" src="${c.license_image}"></div>`;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function openBackup(){$('modal').innerHTML=`<div class="modal-box"><div class="modal-head"><h2>قاعدة البيانات</h2><button class="close" onclick="closeModal()">✕</button></div><p>البيانات محفوظة في قاعدة SQLite محلية داخل المتصفح وتستمر بعد Refresh. يمكنك أخذ نسخة <b>.db</b> أو استعادتها لاحقاً.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="downloadDb()">⬇️ تحميل parking.db</button><label class="btn btn-light">⬆️ استعادة parking.db<input id="restoreDb" type="file" accept=".db,application/octet-stream" hidden onchange="restoreDb(this.files[0])"></label></div><p class="upload-note" style="margin-top:15px">مهم: GitHub Pages لا يستطيع الكتابة داخل ملفات المستودع أثناء تشغيل الموقع. لذلك ملف .db المحلي هو النسخة التشغيلية لهذا الإصدار.</p></div>`;$('modal').classList.remove('hidden')}
function downloadDb(){const b=db.export(),blob=new Blob([b],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='parking.db';a.click();URL.revokeObjectURL(a.href)}async function restoreDb(file){if(!file)return;try{const b=new Uint8Array(await file.arrayBuffer()),test=new SQL.Database(b);test.exec('SELECT * FROM lines');db.close();db=test;await saveDb();closeModal();renderAll();toast('تم استعادة قاعدة البيانات')}catch(e){toast('ملف DB غير صالح')}}
function openPrint(){const l=rows('SELECT * FROM lines ORDER BY name');$('modal').innerHTML=`<div class="modal-box"><div class="modal-head"><h2>طباعة كشف العربيات</h2><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>اختيار الخط</label><select id="printLine"><option value="">كل الخطوط</option>${l.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><button class="btn btn-primary" onclick="printSelected()">🖨️ طباعة</button></div>`;$('modal').classList.remove('hidden')}
function printSelected(){const id=$('printLine').value;let c=rows('SELECT * FROM cars ORDER BY plate');if(id)c=c.filter(x=>x.line_id===id);const title=id?lineName(id):'كل الخطوط',w=window.open('','_blank');if(!w)return toast('اسمح بفتح نافذة الطباعة');w.document.write(`<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>كشف العربيات</title><style>body{font-family:Arial;padding:25px}h1{text-align:center}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #888;padding:8px;text-align:right}th{background:#eee}.meta{text-align:center;color:#555}</style></head><body><h1>كشف موقف العربيات</h1><div class="meta">خط السير: ${esc(title)} — عدد العربيات: ${c.length}</div><table><tr><th>م</th><th>رقم السيارة</th><th>اسم الموقف</th><th>المالك</th><th>رقم الشاسيه</th><th>خط السير</th><th>عدد الركاب</th></tr>${c.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.plate)}</td><td>${esc(x.parking)}</td><td>${esc(x.owner)}</td><td>${esc(x.chassis)}</td><td>${esc(lineName(x.line_id))}</td><td>${esc(x.passengers)}</td></tr>`).join('')}</table><script>window.onload=()=>window.print();</script></body></html>`);w.document.close()}
</script></body></html>
